{% extends "base.html" %}
{% block content %}
<div class="form-box">
    <div style="text-align: center; margin-bottom: 50px;">
        <p class="shop-tag">WELCOME BACK</p>
        <h2 style="font-size: 2.2rem; font-weight: 200; margin-top: 10px;">로그인</h2>
    </div>
    <form action="/login" method="POST">
        <div class="input-group">
            <label>아이디</label>
            <input type="text" name="id" class="input-style" required autofocus>
        </div>
        <div class="input-group">
            <label>비밀번호</label>
            <input type="password" name="pw" class="input-style" required>
        </div>
        <button type="submit" class="btn btn-black" style="margin-top: 30px;">시작하기</button>
    </form>
    <div style="text-align: center; margin-top: 30px;">
        <p style="font-size: 0.85rem; color: #999;">계정이 없으신가요? <a href="/signup" style="color: #000; font-weight: 700;">회원가입</a></p>
    </div>
</div>
{% endblock %}
