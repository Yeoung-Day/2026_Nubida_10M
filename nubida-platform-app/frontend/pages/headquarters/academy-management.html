<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const sectionMap = {
        'contracts.html': 'consult', 'portfolio-templates.html': 'report',
        'withdrawn-students.html': 'system', 'lecture-editor.html': 'eduops',
        'branches.html': 'consult', 'categories.html': 'eduops',
        'academy-management.html': 'consult', 'courses.html': 'eduops', 'users.html': 'consult',
        'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
        'director-reports.html': 'report', 'notices.html': 'system',
        'edu-materials.html': 'eduops', 'portfolio.html': 'report',
        'approvals.html': 'system', 'settings.html': 'system', 'site-manager.html': 'site', 'chat.html': 'system',
        'category-manager.html': 'system', 'category.html': 'system',
        'inquiries.html': 'eduops',
    };
    const currentSection = sectionMap[currentPage];
    if (currentSection) {
        const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
        if (toggle) { toggle.classList.add('open'); const sub = document.getElementById(`sub-${currentSection}`); if (sub) sub.classList.add('open'); }
    }
    document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const section = this.dataset.section;
            const sub = document.getElementById(`sub-${section}`);
            if (!sub) return;
            const isOpen = sub.classList.contains('open');
            if (isOpen) { sub.classList.remove('open'); this.classList.remove('open'); }
            else {
                document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
                sub.classList.add('open'); this.classList.add('open');
            }
        });
    });
    document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href && href === currentPage) item.classList.add('active');
    });
});
</script>

   <script>
// ===== XSS 방지 헬퍼 =====
window.esc = window.esc || function(str) {
    if (str == null) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
};

// ===== State =====
let allAcademies = [];
let filteredAcademies = [];
let currentPage = 1;
let totalPages = 1;
const PER_PAGE = 20;

// ===== Status Labels =====
const statusLabels = {
    'active': '운영중',
    'inactive': '정지',
};

// ===== Load Academy Stats =====
async function loadAcademyStats() {
    try {
        const res = await apiGet('/headquarters/academies/branch-stats');
        const academies = res.data || [];
        document.getElementById('statTotalAcademies').textContent = academies.length;
        document.getElementById('statTotalStudents').textContent = academies.reduce(function(s, a) { return s + (a.student_count || 0); }, 0);
        document.getElementById('statTotalCourses').textContent = academies.reduce(function(s, a) { return s + (a.course_count || 0); }, 0);
    } catch (err) {
        console.warn('Failed to load academy stats:', err);
    }
}

// ===== Load Academies =====
async function loadAcademies(page) {
    currentPage = page || 1;
    const status = document.getElementById('statusFilter').value;

    try {
        let url = '/headquarters/academies?page=' + currentPage + '&per_page=' + PER_PAGE;
        if (status) url += '&status=' + encodeURIComponent(status);

        const res = await apiGet(url);
        allAcademies = res.data || [];
        totalPages = res.total_pages || 1;
        filteredAcademies = [...allAcademies];
        renderAcademies();
        renderPaginationUI();
        document.getElementById('academyCount').textContent = (res.total || 0) + '개';
    } catch (err) {
        console.error('Failed to load academies:', err);
        showAlert('학원 목록을 불러오는데 실패했습니다.', 'error');
    }
}

// ===== Render Academies =====
function renderAcademies() {
    const tbody = document.getElementById('academyTableBody');

    if (filteredAcademies.length === 0) {
        tbody.innerHTML = '<tr class="branch-empty"><td colspan="10">🏫 등록된 학원이 없습니다.</td></tr>';
        return;
    }

    let html = '';
    filteredAcademies.forEach(function(a) {
        const statusLabel = statusLabels[a.status] || a.status || '-';
        const statusClass = a.status || 'inactive';
        const createdDate = a.created_at ? a.created_at.split('T')[0] : '-';

        html += '<tr>';
        html += '<td style="font-size:12px;color:var(--text-tertiary)">' + esc('' + a.id) + '</td>';
        html += '<td><strong>' + esc(a.name || '-') + '</strong></td>';
        html += '<td><span class="branch-code">' + esc(a.code || '-') + '</span></td>';
        html += '<td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(a.address || '') + '">' + esc(a.address || '-') + '</td>';
        html += '<td style="white-space:nowrap"><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.student_count ?? a.student_cnt ?? 0) + '</td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.employee_count ?? a.employee_cnt ?? a.staff_count ?? 0) + '</td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.course_count ?? a.course_cnt ?? 0) + '</td>';
        html += '<td style="font-size:12px;color:var(--text-tertiary)">' + createdDate + '</td>';
        html += '<td>';
        html += '<div class="action-cell">';
        html += '<button class="btn btn-ghost btn-xs" onclick="openEditModal(' + a.id + ')">✏️ 수정</button>';
        html += '<button class="btn btn-ghost btn-xs" onclick="openCourseLinkModal(' + a.id + ',\'' + esc(a.name) + '\')">🔗 강좌</button>';
        html += '<button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="confirmDeleteAcademy(' + a.id + ',\'' + esc(a.name) + '\')">🗑️ 삭제</button>';
        html += '</div></td></tr>';
    });
    tbody.innerHTML = html;
}

// ===== Filter =====
function filterAcademies() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) {
        filteredAcademies = [...allAcademies];
    } else {
        filteredAcademies = allAcademies.filter(function(a) {
            return (a.name && a.name.toLowerCase().includes(q)) ||
                   (a.code && a.code.toLowerCase().includes(q)) ||
                   (a.address && a.address.toLowerCase().includes(q));
        });
    }
    renderAcademies();
}

// ===== Pagination =====
function renderPaginationUI() {
    const wrap = document.getElementById('paginationWrap');
    let html = '';

    if (currentPage > 1) {
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(1)">«</button>';
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + (currentPage - 1) + ')">‹</button>';
    } else {
        html += '<button class="btn btn-ghost btn-sm" disabled>«</button><button class="btn btn-ghost btn-sm" disabled>‹</button>';
    }

    const start = Math.max(1, currentPage - 2);
    const end = Math.min(totalPages, currentPage + 2);
    for (let i = start; i <= end; i++) {
        html += '<button class="btn btn-sm ' + (i === currentPage ? 'btn-primary' : 'btn-ghost') + '" onclick="loadAcademies(' + i + ')">' + i + '</button>';
    }

    if (currentPage < totalPages) {
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + (currentPage + 1) + ')">›</button>';
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + totalPages + ')">»</button>';
    } else {
        html += '<button class="btn btn-ghost btn-sm" disabled>›</button><button class="btn btn-ghost btn-sm" disabled>»</button>';
    }

    wrap.innerHTML = html;
}

// ===== Create Academy =====
async function createAcademy() {
    const name = document.getElementById('newName').value.trim();
    const code = document.getElementById('newCode').value.trim().toUpperCase();
    const address = document.getElementById('newAddress').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const email = document.getElementById('newEmail').value.trim();

    if (!name || !code) {
        showAlert('학원명과 코드는 필수 항목입니다.', 'error');
        return;
    }

    try {
        await apiPost('/headquarters/academies', { name, code, address, phone, email });
        showAlert('학원이 등록되었습니다.', 'success');
        closeModal('createAcademyModal');
        document.getElementById('newName').value = '';
        document.getElementById('newCode').value = '';
        document.getElementById('newAddress').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newEmail').value = '';
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 등록에 실패했습니다.', 'error');
    }
}

// ===== Open Edit Modal =====
function openEditModal(academyId) {
    const academy = allAcademies.find(function(a) { return a.id === academyId; });
    if (!academy) {
        showAlert('학원 정보를 찾을 수 없습니다.', 'error');
        return;
    }
    document.getElementById('editAcademyId').value = academy.id;
    document.getElementById('editName').value = academy.name || '';
    document.getElementById('editStatus').value = academy.status || 'active';
    document.getElementById('editAddress').value = academy.address || '';
    document.getElementById('editPhone').value = academy.phone || '';
    document.getElementById('editEmail').value = academy.email || '';
    document.getElementById('editAcademyModal').style.display = 'flex';
}

// ===== Open Create Modal =====
function openCreateModal() {
    document.getElementById('createAcademyModal').style.display = 'flex';
}

// ===== Update Academy =====
async function updateAcademy() {
    const id = document.getElementById('editAcademyId').value;
    const name = document.getElementById('editName').value.trim();
    const status = document.getElementById('editStatus').value;
    const address = document.getElementById('editAddress').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const email = document.getElementById('editEmail').value.trim();

    if (!name) {
        showAlert('학원명을 입력하세요.', 'error');
        return;
    }

    try {
        await apiPut('/headquarters/academies/' + id, { name, status, address, phone, email });
        showAlert('학원 정보가 수정되었습니다.', 'success');
        closeModal('editAcademyModal');
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 정보 수정에 실패했습니다.', 'error');
    }
}

// ===== Delete Academy =====
let deleteTargetId = null;
let deleteTargetName = '';

function confirmDeleteAcademy(id, name) {
    deleteTargetId = id;
    deleteTargetName = name || '';
    if (confirm('정말 학원 "' + (deleteTargetName || id) + '" 을(를) 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
        executeDeleteAcademy();
    }
}

async function executeDeleteAcademy() {
    if (!deleteTargetId) return;
    try {
        await apiDelete('/headquarters/academies/' + deleteTargetId);
        showAlert('학원이 삭제되었습니다.', 'success');
        deleteTargetId = null;
        deleteTargetName = '';
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 삭제에 실패했습니다.', 'error');
    }
}

async function deleteAcademy(id) {
    confirmDeleteAcademy(id, '');
}

// ===== 강좌 연결 모달 =====
let _linkAcademyId = null;
// 임시 선택 상태: 연결 예정(checked=true) / 해제 예정(checked=false) course_id Set
let _pendingLink = new Set();    // 체크 ON → 연결 예정
let _pendingUnlink = new Set();  // 체크 OFF → 해제 예정
let _linkedIds = new Set();      // 현재 연결된 강좌 ID (로드 시 확정)
let _allowedCategoryKeys = null; // 해당 원장에게 권한 있는 활성 카테고리 키 목록 (null이면 필터 미적용)
let _linkDirectorId = null;      // 원장 director User id (카테고리 권한 조회용)

async function openCourseLinkModal(academyId, academyName) {
    _linkAcademyId = academyId;
    _pendingLink = new Set();
    _pendingUnlink = new Set();
    document.getElementById('linkAcademyId').value = academyId;
    document.getElementById('courseLinkTitle').textContent = '🔗 ' + esc(academyName) + ' — 강좌 연결';

    // 카테고리 로드 — 해당 원장에 권한이 있는 카테고리만 노출, 그 키들로 강좌 필터링
    const catSel = document.getElementById('linkCategoryFilter');
    _allowedCategoryKeys = null;
    _linkDirectorId = null;
    try {
        // 1) 이 academy에 연결된 원장(director) 찾기: academy.director_name → directors/list에서 매칭
        const academyRec = (allAcademies || []).find(a => a.id === academyId);
        const directorName = academyRec && academyRec.director_name;
        let allowedKeys = [];
        if (directorName) {
            const dirRes = await apiGet('/headquarters/directors/list');
            const directors = dirRes.data || [];
            const dir = directors.find(d => d.name === directorName);
            if (dir) {
                _linkDirectorId = dir.id;
                const permRes = await apiGet('/headquarters/directors/' + dir.id + '/categories');
                const permData = permRes.data || {};
                allowedKeys = (permData.categories || [])
                    .filter(c => c.is_active)
                    .map(c => c.key)
                    .filter(Boolean);
            }
        }
        _allowedCategoryKeys = allowedKeys.length ? allowedKeys : null;

        // 2) 카테고리 목록 — 원장 권한이 있으면 그 키만, 없으면 전체
        const catRes = await apiGet('/headquarters/categories');
        let cats = catRes.data || [];
        if (allowedKeys.length) {
            cats = cats.filter(c => allowedKeys.indexOf(c.key) !== -1);
        }
        catSel.innerHTML = '<option value="">전체 카테고리</option>' +
            cats.map(c => '<option value="' + esc(c.key) + '">' + esc(c.name) + '</option>').join('');
    } catch (e) {
        catSel.innerHTML = '<option value="">카테고리 로드 실패</option>';
    }

    // openModal은 classList.add('active') 방식 (api.js) — 중복 display 설정 제거
    openModal('courseLinkModal');
    loadLinkableCourses();
}

// 전체 조회 헬퍼: 페이지네이션 루프로 per_page 상한(100) 내에서 전부 수집
async function fetchAllCourses(category) {
    let all = [];
    let page = 1;
    const perPage = 100;
    while (true) {
        let url = '/headquarters/courses?page=' + page + '&per_page=' + perPage;
        if (category) url += '&category=' + encodeURIComponent(category);
        const res = await apiGet(url);
        const data = res.data || [];
        all = all.concat(data);
        if (data.length < perPage) break;
        page += 1;
        if (page > 50) break; // 안전장치
    }
    return all;
}

async function loadLinkableCourses() {
    const container = document.getElementById('linkableCourseList');
    const academyId = _linkAcademyId;
    const category = document.getElementById('linkCategoryFilter').value;

    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary)">로딩 중...</div>';

    try {
        // 연결된 강좌 조회 (per_page 상한 500 허용, 페이지네이션 안전 처리)
        let linked = [];
        {
            let page = 1;
            const perPage = 100;
            while (true) {
                const res = await apiGet('/headquarters/academy-courses?academy_id=' + academyId + '&page=' + page + '&per_page=' + perPage);
                const data = res.data || [];
                linked = linked.concat(data);
                if (data.length < perPage) break;
                page += 1;
                if (page > 50) break;
            }
        }
        _linkedIds = new Set(linked.map(l => l.course_id));

        // 전체 강좌 조회 (per_page=100 상한 준수, 페이지네이션 루프)
        const courses = await fetchAllCourses(category);

        // 카테고리 필터 (API 필터 + 클라이언트 이중 안전)
        let filtered = courses;
        if (category) filtered = filtered.filter(c => c.category === category);
        // ★ 해당 원장에게 권한 있는 카테고리만 강좌 노출 (다른 카테고리 강좌는 숨김)
        if (_allowedCategoryKeys && _allowedCategoryKeys.length) {
            filtered = filtered.filter(c => c.category && _allowedCategoryKeys.indexOf(c.category) !== -1);
        }

        if (!filtered.length) {
            container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-tertiary)">연결 가능한 강좌가 없습니다</div>';
            return;
        }

        let html = '';
        filtered.forEach(c => {
            // 임시 상태 반영: pendingUnlink로 해제 예정이면 연결 아님, pendingLink로 연결 예정이면 연결
            const isLinked = (_linkedIds.has(c.id) && !_pendingUnlink.has(c.id)) || _pendingLink.has(c.id);
            const style = isLinked ? 'opacity:0.6' : '';
            const statusLabel = c.status === 'active' ? '공개' : (c.status === 'draft' ? '비공개' : '중지');
            html += '<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--border-subtle);' + style + '">';
            html += '<input type="checkbox" id="clc_' + c.id + '" value="' + c.id + '" ' + (isLinked ? 'checked' : '') + ' onchange="onCourseCheck(' + c.id + ')">';
            html += '<label for="clc_' + c.id + '" style="flex:1;cursor:pointer;font-size:13px">';
            html += '<strong>' + esc(c.title) + '</strong>';
            html += ' <span style="color:var(--text-tertiary)">[' + esc(c.category || '-') + ']</span>';
            html += ' <span class="badge ' + (c.status === 'active' ? 'badge-success' : 'badge-warning') + '" style="font-size:10px">' + statusLabel + '</span>';
            if (isLinked) html += ' <span style="font-size:11px;color:var(--success)">✓ 연결됨</span>';
            html += '</label></div>';
        });
        container.innerHTML = html;
    } catch (e) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#EF4444">오류: ' + esc(e.message) + '</div>';
    }
}

// 체크박스 변경 → 즉시 저장하지 않고 임시 상태만 기록
function onCourseCheck(courseId) {
    const cb = document.getElementById('clc_' + courseId);
    if (!cb) return;
    if (cb.checked) {
        _pendingUnlink.delete(courseId);
        _pendingLink.add(courseId);
    } else {
        _pendingLink.delete(courseId);
        _pendingUnlink.add(courseId);
    }
    // 연결 여부 시각 표시 갱신 (opacity)
    const row = cb.closest('div');
    if (row) row.style.opacity = cb.checked ? '0.6' : '';
}

// [적용] 버튼 → 임시 상태를 일괄 저장
async function applyCourseLinks() {
    const academyId = _linkAcademyId;
    if (!academyId) return;
    const btn = document.getElementById('applyCourseLinkBtn');
    if (btn) { btn.disabled = true; btn.textContent = '저장 중...'; }

    try {
        // 1) 해제 예정 처리
        for (const courseId of _pendingUnlink) {
            // 기존 AcademyCourse ID 찾기 (페이지네이션 루프)
            let linked = null;
            {
                let page = 1;
                const perPage = 100;
                while (true) {
                    const res = await apiGet('/headquarters/academy-courses?academy_id=' + academyId + '&page=' + page + '&per_page=' + perPage);
                    const data = res.data || [];
                    linked = data.find(l => l.course_id === courseId) || null;
                    if (linked || data.length < perPage) break;
                    page += 1;
                    if (page > 50) break;
                }
            }
            if (linked) await apiDelete('/headquarters/academy-courses/' + linked.id);
        }
        // 2) 연결 예정 처리
        for (const courseId of _pendingLink) {
            await apiPost('/headquarters/academy-courses', { academy_id: academyId, course_id: courseId });
        }
        showAlert('강좌 연결이 저장되었습니다', 'success');
        _pendingLink = new Set();
        _pendingUnlink = new Set();
        closeModal('courseLinkModal');
        loadAcademies(currentPage);
        loadAcademyStats();
    } catch (e) {
        showAlert(e.message || '처리 실패', 'error');
    } finally {
        if (btn) { btn.disabled = false; btn.textContent = '적용'; }
    }
}

// ===== Close Modal =====
function closeModal(modalId) {
    var el = document.getElementById(modalId);
    if (!el) return;
    // api.js openModal은 classList 'active' 방식 → 클래스와 인라인 display 모두 해제해야
    // style.css의 .modal-overlay.active { display:flex !important }가 인라인 none을 덮어쓰는 문제 방지
    el.classList.remove('active');
    el.style.display = 'none';
    // 강좌 연결 모달 닫을 때 임시 선택 상태 초기화
    if (modalId === 'courseLinkModal') {
        _pendingLink = new Set();
        _pendingUnlink = new Set();
    }
}

// ===== Initialize =====
onAuthReady(async function() {
    await Promise.all([loadAcademies(1), loadAcademyStats()]);
});

</script>
