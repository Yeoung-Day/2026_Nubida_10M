            <div class="top-nav"><div class="top-nav-left"><button class="hamburger-btn" id="hamburgerBtn" aria-label="메뉴 열기">☰</button><h1>상담 신청</h1></div>

                    <button class="btn btn-primary btn-sm" onclick="openCounselModal()">+ 상담 신청</button>

            </div>
            <div class="stats-grid" style="grid-template-columns:repeat(3,1fr)">
                <div class="stat-card stat-card-accent"><div class="stat-label">전체 신청</div><div class="stat-value" id="totalRequests">-</div></div>
                <div class="stat-card stat-card-accent warning"><div class="stat-label">대기</div><div class="stat-value" id="pendingRequests">-</div></div>
                <div class="stat-card stat-card-accent success"><div class="stat-label">완료</div><div class="stat-value" id="completedRequests">-</div></div>
            </div>
            <div class="card card-premium">
                <div class="card-header"><h2>상담 신청 목록</h2></div>
                <div class="card-body" style="padding:0">
                    <div class="table-wrapper">
                        <table class="data-table" data-card-view>
                            <thead><tr><th>자녀</th><th>제목</th><th>유형</th><th>희망일</th><th>상태</th><th>답변</th><th>관리</th></tr></thead>
                            <tbody id="counselBody"><tr><td colspan="7" class="empty-state" style="padding:var(--space-9)">로딩 중...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>

    <div class="modal-overlay" id="counselModal">
        <div class="modal">
            <h2>상담 신청</h2>
            <form id="counselForm" onsubmit="return false;">
                <input type="hidden" id="editCounselId">
                <div class="form-group"><label>자녀</label>
                    <select class="form-select" id="counselChild"><option value="">선택</option></select>
                </div>
                <div class="form-group"><label>제목</label><input type="text" class="form-input" id="counselTitle" required placeholder="상담 제목"></div>
                <div class="form-row">
                    <div class="form-group"><label>유형</label>
                        <select class="form-select" id="counselType">
                            <option value="academic">학습 상담</option>
                            <option value="career">진로 상담</option>
                            <option value="behavior">생활 상담</option>
                            <option value="other">기타</option>
                        </select>
                    </div>
                    <div class="form-group"><label>희망일</label><input type="date" class="form-input" id="counselDate"></div>
                </div>
                <div class="form-group"><label>내용</label><textarea class="form-textarea" id="counselContent" rows="4" required placeholder="상담 내용을 입력해주세요"></textarea></div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('counselModal')">취소</button>
                    <button type="submit" class="btn btn-primary">신청</button>
                </div>
            </form>
        </div>
    </div>
