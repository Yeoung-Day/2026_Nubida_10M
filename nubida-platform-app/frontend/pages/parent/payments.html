    <script>
        const STATUS_LABELS = {completed:'완료',pending:'대기',failed:'실패',refunded:'환불',cancelled:'취소'};
        const METHOD_LABELS = {card:'카드',kakao:'카카오페이',toss:'토스페이',naver:'네이버페이',virtual_account:'가상계좌',transfer:'계좌이체'};
        let allChildren = [];
        let paymentSummary = null;

        document.addEventListener('DOMContentLoaded', function() {
            requireAuth();
            renderSidebarUser();
            loadChildren();
            loadPaymentSummary();
            loadPayments();
        });

        function showToast(msg, type) {
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { if(t.parentNode) t.parentNode.removeChild(t); }, 3000);
        }

        async function loadChildren() {
            try {
                const res = await apiGet('/parent/children');
                const data = res.data || [];
                allChildren = data;
                const sel = document.getElementById('filterChild');
                sel.innerHTML = '<option value="">전체 자녀</option>' + data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            } catch(e) { console.error('loadChildren error:', e); }
        }

        async function loadPaymentSummary() {
            try {
                const res = await apiGet('/payments/parent-summary');
                paymentSummary = res.data || [];
                renderCourseStatus();
            } catch(e) { 
                console.error('loadPaymentSummary error:', e);
                document.getElementById('childrenCourseStatus').innerHTML = '<p style="text-align:center;color:var(--text-tertiary);padding:24px;">결제 정보를 불러올 수 없습니다.</p>';
            }
        }

        function renderCourseStatus() {
            const container = document.getElementById('childrenCourseStatus');
            if (!paymentSummary || paymentSummary.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:var(--text-tertiary);padding:24px;">등록된 자녀가 없습니다.</p>';
                return;
            }

            let globalTotalPaid = 0;
            let globalCompleted = 0;
            let globalUnpaid = 0;
            let globalUnpaidAmount = 0;

            let html = '';
            paymentSummary.forEach(child => {
                const hasUnpaid = child.courses.some(c => c.payment_status === 'unpaid' || c.payment_status === 'pending');
                html += `<div class="child-section" style="padding:var(--space-3) var(--space-5);border-bottom:2px solid var(--border-color);">
                    <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);">
                        <span style="font-weight:var(--weight-bold);font-size:var(--text-base);">👤 ${child.child_name}</span>
                        <span class="badge badge-${hasUnpaid ? 'warning' : 'success'}" style="font-size:10px;">${hasUnpaid ? '⚠️ 미납 있음' : '✅ 완납'}</span>
                    </div>`;

                child.courses.forEach(course => {
                    const isUnpaid = course.payment_status === 'unpaid' || course.payment_status === 'pending';
                    const badgeClass = course.payment_status === 'paid' ? 'success' : (course.payment_status === 'partial' ? 'warning' : 'danger');
                    const badgeLabel = course.payment_status === 'paid' ? '✅ 완납' : (course.payment_status === 'partial' ? '⚠️ 일부' : '❌ 미납');
                    
                    if (course.payment_status === 'paid') globalCompleted++;
                    else if (course.payment_status === 'unpaid' || course.payment_status === 'pending') {
                        globalUnpaid++;
                        globalUnpaidAmount += course.course_price || 0;
                    }
                    globalTotalPaid += (course.payment_status === 'paid' ? (course.course_price || 0) : 0);

                    html += `<div class="course-pay-card">
                        <div class="course-pay-info">
                            <div class="course-pay-name">📚 ${course.course_name}</div>
                            <div class="course-pay-meta">${Number(course.course_price || 0).toLocaleString()}원 · <span class="badge badge-${badgeClass}" style="font-size:10px">${badgeLabel}</span></div>
                        </div>
                        <div style="display:flex;align-items:center;gap:var(--space-3);">
                            ${isUnpaid ? `<span class="course-pay-amount">${Number(course.course_price || 0).toLocaleString()}원</span>
                            <a href="pay-tuition.html?child_id=${child.child_id}&course_id=${course.course_id}" class="btn btn-primary btn-pay-now">💳 결제하기</a>` 
                            : `<span style="font-size:var(--text-xs);color:var(--text-tertiary);">${course.paid_at ? new Date(course.paid_at).toLocaleDateString('ko-KR') + ' 결제완료' : '결제완료'}</span>`}
                        </div>
                    </div>`;
                });
                html += `</div>`;
            });

            // Update stats
            document.getElementById('totalPaid').textContent = globalTotalPaid.toLocaleString() + '원';
            document.getElementById('completedCount').textContent = globalCompleted;
            document.getElementById('pendingCount').textContent = globalUnpaid;
            document.getElementById('unpaidAmount').textContent = globalUnpaidAmount.toLocaleString() + '원';

            container.innerHTML = html || '<p style="text-align:center;color:var(--text-tertiary);padding:24px;">수강 중인 강좌가 없습니다.</p>';
        }

        async function loadPayments() {
            const tbody = document.getElementById('paymentBody');
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-tertiary)">⏳ 로딩 중...</td></tr>';
            try {
                const params = {page: 1, per_page: 50};
                const childId = document.getElementById('filterChild').value;
                if (childId) params.child_id = childId;

                const res = await apiGet('/parent/payments?' + new URLSearchParams(params));
                const data = res.data || [];

                if (!data || data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-tertiary)">📭 결제 내역이 없습니다.</td></tr>';
                    return;
                }

                tbody.innerHTML = data.map(p => {
                    const statusBadge = '<span class="badge badge-'+p.status+'">'+(STATUS_LABELS[p.status]||p.status)+'</span>';
                    const methodLabel = METHOD_LABELS[p.method] || p.method;
                    const paidAt = p.paid_at ? new Date(p.paid_at).toLocaleDateString('ko-KR') : '-';
                    return `<tr>
                        <td>${p.student_name || '['+p.student_id+']'}</td>
                        <td>${p.course_name || '-'}</td>
                        <td style="font-weight:600">${Number(p.amount).toLocaleString()}원</td>
                        <td>${methodLabel}</td>
                        <td>${statusBadge}</td>
                        <td>${paidAt}</td>
                        <td><button class="btn btn-outline btn-xs" onclick="viewReceipt(${p.id})">보기</button></td>
                    </tr>`;
                }).join('');
            } catch(e) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-tertiary)">⚠️ 불러오기 실패</td></tr>';
                showToast('데이터를 불러올 수 없습니다', 'error');
            }
        }

        function viewReceipt(id) {
            // Navigate to pay-tuition with receipt view or show modal
            const p = paymentSummary ? paymentSummary.flatMap(c => c.courses).find(co => co.latest_payment_id === id) : null;
            if (p) {
                showToast('영수증: 결제ID #' + id, 'info');
            } else {
                showToast('영수증: 결제ID #' + id, 'info');
            }
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function retryPayment() {
            showToast('결제를 다시 시도합니다.', 'info');
            closeModal('receiptModal');
        }
    </script>
