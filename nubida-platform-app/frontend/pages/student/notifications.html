<style>
    /* ══════════════════════════════════════════════════════
       학생 알림 — 세련된·미니멀 (nf-*)
       ══════════════════════════════════════════════════════ */
    .nf-head { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
    .nf-head h2 { font-size:16px; font-weight:700; color:#111827; margin:0; letter-spacing:-.2px; }
    .nf-head .nf-count { font-size:12.5px; color:#9CA3AF; }
    .nf-head .nf-count b { color:#4F5EF8; font-weight:700; }
    .nf-head .nf-actions { margin-left:auto; }

    /* 필터 탭 */
    .nf-tabs { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
    .nf-tab {
      border:1px solid #EDF0F5; background:#fff; color:#6B7280;
      border-radius:999px; padding:7px 15px; font-size:12.5px; font-weight:600;
      cursor:pointer; transition:all .15s; display:inline-flex; align-items:center; gap:6px;
    }
    .nf-tab:hover { border-color:#D7DCE6; color:#374151; }
    .nf-tab.active { background:#4F5EF8; border-color:#4F5EF8; color:#fff; }
    .nf-tab .nf-tab-n {
      min-width:18px; height:18px; padding:0 5px; border-radius:9px;
      background:#F1F4F9; color:#6B7280; font-size:10.5px; font-weight:700;
      display:inline-flex; align-items:center; justify-content:center;
      font-variant-numeric:tabular-nums;
    }
    .nf-tab.active .nf-tab-n { background:rgba(255,255,255,.25); color:#fff; }

    /* 알림 리스트 */
    .nf-list { display:flex; flex-direction:column; gap:10px; }
    .nf-item {
      display:flex; gap:14px; align-items:flex-start;
      background:#fff; border:1px solid #EEF0F4; border-radius:14px;
      padding:16px 18px; transition:border-color .15s, box-shadow .15s;
      position:relative;
    }
    .nf-item:hover { border-color:#DDE2EC; box-shadow:0 2px 10px rgba(17,24,39,.04); }
    .nf-item.is-unread { border-left:3px solid #4F5EF8; background:#FCFDFF; }
    .nf-item.is-read { opacity:.78; }

    .nf-ico {
      flex:0 0 auto; width:38px; height:38px; border-radius:11px;
      display:flex; align-items:center; justify-content:center;
      background:#F1F4F9; color:#64748B;
    }
    .nf-ico svg { width:19px; height:19px; }
    .nf-ico.k-notice      { background:#EEF2FF; color:#4F5EF8; }
    .nf-ico.k-learning    { background:#ECFDF5; color:#10B981; }
    .nf-ico.k-approved    { background:#ECFDF5; color:#059669; }
    .nf-ico.k-rejected    { background:#FEF2F2; color:#EF4444; }
    .nf-ico.k-revision    { background:#FFF7ED; color:#F59E0B; }
    .nf-ico.k-feedback    { background:#F5F3FF; color:#8B5CF6; }
    .nf-ico.k-portfolio   { background:#EFF6FF; color:#3B82F6; }

    .nf-body { flex:1 1 auto; min-width:0; }
    .nf-title {
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
      font-size:13.5px; font-weight:700; color:#111827;
      margin:0 0 5px; letter-spacing:-.2px; line-height:1.35;
    }
    .nf-newdot {
      width:6px; height:6px; border-radius:50%; background:#4F5EF8; flex:0 0 auto;
    }
    .nf-text {
      font-size:12.5px; color:#6B7280; line-height:1.55;
      margin:0; word-break:break-word;
    }
    .nf-meta { margin-top:8px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .nf-chip {
      font-size:10.5px; font-weight:700; letter-spacing:.02em;
      padding:3px 8px; border-radius:6px; background:#F1F4F9; color:#6B7280;
    }
    .nf-chip.k-notice    { background:#EEF2FF; color:#4F5EF8; }
    .nf-chip.k-learning  { background:#ECFDF5; color:#059669; }
    .nf-chip.k-approved  { background:#ECFDF5; color:#059669; }
    .nf-chip.k-rejected  { background:#FEF2F2; color:#DC2626; }
    .nf-chip.k-revision  { background:#FFF7ED; color:#B45309; }
    .nf-chip.k-feedback  { background:#F5F3FF; color:#7C3AED; }
    .nf-chip.k-portfolio { background:#EFF6FF; color:#2563EB; }
    .nf-time { font-size:11.5px; color:#9CA3AF; font-variant-numeric:tabular-nums; }

    /* 빈 상태 */
    .nf-empty {
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:64px 20px; text-align:center;
    }
    .nf-empty .nf-empty-ico {
      width:56px; height:56px; border-radius:16px; background:#F4F6F9;
      display:flex; align-items:center; justify-content:center; margin-bottom:14px;
      color:#B0B7C3;
    }
    .nf-empty .nf-empty-ico svg { width:26px; height:26px; }
    .nf-empty h3 { font-size:14px; font-weight:600; color:#6B7280; margin:0 0 5px; }
    .nf-empty p { font-size:12.5px; color:#9CA3AF; margin:0; }

    /* 스켈레톤 */
    .nf-sk {
      height:88px; border-radius:14px;
      background:linear-gradient(90deg,#F4F6F9 25%,#EDF0F5 50%,#F4F6F9 75%);
      background-size:200% 100%; animation:nfShimmer 1.4s infinite;
    }
    @keyframes nfShimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const now = new Date();
            const dateEl = document.getElementById('todayDate');
            if (dateEl) {
                dateEl.textContent = now.toLocaleDateString('ko-KR', {
                    year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
                });
            }
            // 필터 탭 바인딩
            document.querySelectorAll('#nfTabs .nf-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#nfTabs .nf-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    nfFilter = btn.dataset.filter || 'all';
                    renderList();
                });
            });
            loadNotifications();
        });

        let nfAll = [];
        let nfFilter = 'all';

        // ── 알림 타입 → 분류/아이콘/라벨 매핑 ──────────────────────
        const NF_SVG = {
            notice:    '<path d="M3 11l18-8v18l-18-8z"/><path d="M11 17v4"/>',
            learning:  '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5V5.5"/>',
            approved:  '<path d="M20 6 9 17l-5-5"/>',
            rejected:  '<circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/>',
            revision:  '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
            feedback:  '<path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.2A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/>',
            portfolio: '<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 15l5-5 4 4 3-3 6 6"/>'
        };

        function nfClassify(type) {
            const t = String(type || '').toLowerCase();
            if (t === 'notice') return { cat: 'notice', cls: 'k-notice', ico: 'notice',    label: '공지' };
            if (t === 'learning_added') return { cat: 'learning', cls: 'k-learning', ico: 'learning', label: '학습내용' };
            if (t === 'portfolio_approved') return { cat: 'portfolio', cls: 'k-approved', ico: 'approved', label: '승인' };
            if (t === 'portfolio_rejected') return { cat: 'portfolio', cls: 'k-rejected', ico: 'rejected', label: '반려' };
            if (t === 'portfolio_revision') return { cat: 'portfolio', cls: 'k-revision', ico: 'revision', label: '수정요청' };
            if (t === 'portfolio_feedback') return { cat: 'portfolio', cls: 'k-feedback', ico: 'feedback', label: '피드백' };
            if (t === 'portfolio_status' || t === 'portfolio_submitted') return { cat: 'portfolio', cls: 'k-portfolio', ico: 'portfolio', label: '포트폴리오' };
            // 그 외는 목록에 오지 않지만 방어적으로 포트폴리오로 처리
            return { cat: 'portfolio', cls: 'k-portfolio', ico: 'portfolio', label: '알림' };
        }

        async function loadNotifications() {
            const listEl = document.getElementById('nfList');
            if (!listEl) return;
            try {
                const res = await apiGet('/sse/notifications');
                let notifications = [];
                if (Array.isArray(res)) notifications = res;
                else if (res && Array.isArray(res.data)) notifications = res.data;
                else if (res && res.data && Array.isArray(res.data.notifications)) notifications = res.data.notifications;
                else if (res && Array.isArray(res.notifications)) notifications = res.notifications;

                nfAll = notifications;
                updateTabCounts();
                renderList();
            } catch (err) {
                listEl.innerHTML = '<div class="nf-empty"><h3>불러오지 못했습니다</h3><p>' + escapeHtml(err.message) + '</p></div>';
                console.error('[notifications] load error:', err);
            }
        }

        function updateTabCounts() {
            const c = { all: nfAll.length, notice: 0, learning: 0, portfolio: 0, unread: 0 };
            nfAll.forEach(n => {
                const k = nfClassify(n.type || n.notif_type);
                if (k.cat === 'notice') c.notice++;
                else if (k.cat === 'learning') c.learning++;
                else c.portfolio++;
                if (!isReadOf(n)) c.unread++;
            });
            const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
            set('nfTabAll', c.all); set('nfTabNotice', c.notice);
            set('nfTabLearning', c.learning); set('nfTabPortfolio', c.portfolio);
            set('nfTabUnread', c.unread);

            const countEl = document.getElementById('notificationCount');
            if (countEl) {
                countEl.innerHTML = c.all === 0
                    ? ''
                    : '총 <b>' + c.all + '</b>건' + (c.unread > 0 ? ' · 안읽음 <b>' + c.unread + '</b>건' : '');
            }
        }

        function isReadOf(n) {
            return n.is_read === true || n.read === true;
        }

        function renderList() {
            const listEl = document.getElementById('nfList');
            const emptyCard = document.getElementById('emptyCard');
            if (!listEl) return;

            let items = nfAll;
            if (nfFilter === 'unread') items = nfAll.filter(n => !isReadOf(n));
            else if (nfFilter !== 'all') items = nfAll.filter(n => nfClassify(n.type || n.notif_type).cat === nfFilter);

            if (items.length === 0) {
                listEl.innerHTML = '';
                listEl.style.display = 'none';
                if (emptyCard) emptyCard.style.display = '';
                return;
            }
            listEl.style.display = '';
            if (emptyCard) emptyCard.style.display = 'none';

            listEl.innerHTML = items.map(n => {
                const k = nfClassify(n.type || n.notif_type);
                const read = isReadOf(n);
                const title = escapeHtml(n.title || n.subject || '알림');
                const text = escapeHtml(n.content || n.message || n.body || '');
                const when = formatRelative(n.created_at || n.date || n.createdAt || '');
                const svg = NF_SVG[k.ico] || NF_SVG.portfolio;
                return '<div class="nf-item ' + (read ? 'is-read' : 'is-unread') + '">'
                    + '<div class="nf-ico ' + k.cls + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + svg + '</svg></div>'
                    + '<div class="nf-body">'
                    +   '<div class="nf-title">' + (read ? '' : '<span class="nf-newdot"></span>') + title + '</div>'
                    +   (text ? '<p class="nf-text">' + text + '</p>' : '')
                    +   '<div class="nf-meta"><span class="nf-chip ' + k.cls + '">' + k.label + '</span><span class="nf-time">' + when + '</span></div>'
                    + '</div>'
                    + '</div>';
            }).join('');
        }

        async function markAllRead() {
            try {
                await apiPost('/sse/notifications/read-all');
                showAlert('모든 알림을 읽음 처리했습니다.', 'success');
                loadNotifications();
            } catch (err) {
                showAlert('일괄 읽음 처리 실패: ' + err.message, 'error');
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatRelative(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(String(dateStr).replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateStr;
                const diff = Date.now() - d.getTime();
                const min = Math.floor(diff / 60000);
                if (min < 1) return '방금 전';
                if (min < 60) return min + '분 전';
                const hr = Math.floor(min / 60);
                if (hr < 24) return hr + '시간 전';
                const day = Math.floor(hr / 24);
                if (day < 7) return day + '일 전';
                return d.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
            } catch (e) {
                return dateStr;
            }
        }

        function formatDateTime(dateStr) {
            if (!dateStr) return '-';
            try {
                const d = new Date(String(dateStr).replace(' ', 'T'));
                if (isNaN(d.getTime())) return dateStr;
                return d.toLocaleDateString('ko-KR', {
                    year: 'numeric', month: '2-digit', day: '2-digit',
                    hour: '2-digit', minute: '2-digit'
                });
            } catch (e) {
                return dateStr;
            }
        }
    </script>
