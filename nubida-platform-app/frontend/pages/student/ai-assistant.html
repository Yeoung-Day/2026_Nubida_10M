    <!-- ============================================================
         누비다 AI — 전문적 디자인 오버레이 (CSS-only, 페이지 로컬)
         · 브랜드 블루(#4F5EF8) 통일 (틸 → 블루)
         · 작은 화면에서 입력필드/전송버튼 사라짐 수정 (flex min-height:0 + dvh)
         ============================================================ -->
    <style id="ai-assistant-design">
    /* ---------- 1) 브랜드 토큰 재선언 (틸 → 브랜드 블루, 이 페이지 한정) ---------- */
    .ai-chat-panel {
      --primary: #4F5EF8;
      --primary-light: #7C8CFF;
      --primary-dark: #4350E8;
      --accent: #4F5EF8;
      --accent-light: #7C8CFF;
      --accent-dark: #4350E8;
      --accent-bg: #EEF2FF;
      --accent-ring: rgba(79, 94, 248, 0.18);
      --brand: #4F5EF8;
      --brand-dark: #4350E8;
      --point: #4F5EF8;
      --point-soft: #EEF2FF;
      --point-line: #E0E7FF;
      --text-link: #4F5EF8;
      --border-focus: #4F5EF8;
    }

    /* ---------- 2) 패널 — 세련된 화이트 카드 (글래스모피즘 제거) ---------- */
    .ai-chat-panel {
      background: #FFFFFF;
      border: 1px solid #E8EAF2;
      border-radius: 18px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.08);
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      overflow: hidden;
      font-family: 'Inter', 'Noto Sans KR', -apple-system, sans-serif;
    }

    /* ---------- 3) ★ 작은 화면 입력필드/전송버튼 사라짐 수정 ---------- */
    /* flex 자식이 content 크기 이하로 줄어들지 못하면 입력줄이 뷰포트 밖으로 밀린다.
       min-height:0 을 주어 메시지 영역이 정상적으로 스크롤되고 입력줄이 항상 보이게 한다. */
    .ai-chat-panel.ai-chat-mode-full {
      min-height: 0;
      height: 100%;
      border-radius: 16px;
    }
    .ai-chat-messages {
      min-height: 0;              /* ★ 핵심: flex 오버플로 방지 */
      flex: 1 1 auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #C7CCE0 transparent;
    }
    .ai-chat-messages::-webkit-scrollbar { width: 8px; }
    .ai-chat-messages::-webkit-scrollbar-thumb {
      background: #C7CCE0; border-radius: 8px; border: 2px solid transparent; background-clip: content-box;
    }
    .ai-chat-input-row {
      flex-shrink: 0;             /* ★ 입력줄은 절대 눌리지 않음 */
      position: sticky;
      bottom: 0;
      background: #FFFFFF;
    }

    /* ---------- 4) 헤더 — 브랜드 그라데이션 ---------- */
    .ai-chat-header {
      background: linear-gradient(135deg, #4F5EF8 0%, #6B78FF 55%, #4350E8 100%);
      padding: 16px 20px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.12) inset;
    }
    .ai-chat-logo {
      width: 40px; height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12) inset;
    }
    .ai-chat-name { font-size: 15.5px; font-weight: 700; letter-spacing: -0.3px; }
    .ai-chat-sub  { font-size: 11.5px; opacity: 0.9; letter-spacing: -0.1px; }
    .ai-chat-close {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .ai-chat-close:hover { background: rgba(255, 255, 255, 0.3); transform: rotate(90deg); }

    /* ---------- 5) 메시지 영역 배경 ---------- */
    .ai-chat-messages {
      background: #F7F8FC;
      padding: 20px 18px;
      gap: 14px;
    }

    /* ---------- 6) 말풍선 — 말끔한 라운드 ---------- */
    .ai-chat-bubble {
      max-width: 86%;
      padding: 13px 17px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.72;
      letter-spacing: -0.2px;
    }
    .ai-chat-bubble-user {
      background: linear-gradient(135deg, #4F5EF8, #5D6BFF);
      color: #FFFFFF;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 8px rgba(79, 94, 248, 0.22);
    }
    .ai-chat-bubble-assistant {
      background: #FFFFFF;
      color: #1F2937;
      border: 1px solid #E8EAF2;
      border-bottom-left-radius: 6px;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
    }
    .ai-chat-bubble-system {
      background: #EEF2FF;
      color: #4350E8;
      font-weight: 500;
      border-radius: 999px;
      padding: 7px 16px;
    }

    /* ---------- 7) 답변 내부 요소 — 블루 계열 정리 ---------- */
    .ai-chat-bubble-assistant code {
      background: #F1F3FA;
      color: #3B4BD8;
      border: 1px solid #E3E7F5;
      border-radius: 5px;
    }
    .ai-chat-bubble-assistant .ai-quote {
      background: linear-gradient(135deg, #EEF2FF, #F5F7FF);
      border-left: 4px solid #4F5EF8;
      color: #3A46B8;
    }
    .ai-chat-bubble-assistant .ai-hl-title {
      background: linear-gradient(to bottom, transparent 25%, #DDE3FF 25%);
      border: 1px solid #DDE3FF;
      color: #2A34A8;
    }
    .ai-chat-bubble-assistant mark {
      background: linear-gradient(to bottom, transparent 22%, #FFE9A8 22%, #FFE9A8 88%, transparent 88%);
      color: #8A5A00;
    }
    .ai-live-cursor { color: #4F5EF8; }

    /* ---------- 8) 해결/부족 버튼 ---------- */
    .ai-btn {
      border-radius: 999px;
      border: 1px solid #E3E6F0;
      color: #475069;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .ai-btn-copy:hover { border-color: #4F5EF8; color: #4F5EF8; background: #F5F6FF; }
    .ai-attempt-tag {
      background: #F1F3FA;
      color: #6B7490;
      font-weight: 500;
    }

    /* ---------- 9) 입력 영역 — 세련된 포커스 링 ---------- */
    .ai-chat-input-row {
      gap: 10px;
      padding: 14px 16px;
      border-top: 1px solid #ECEEF6;
      background: #FFFFFF;
    }
    .ai-chat-input {
      border: 1.5px solid #E3E6F0;
      border-radius: 14px;
      padding: 11px 15px;
      font-size: 14px;
      color: #1F2937;
      background: #FCFCFE;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }
    .ai-chat-input::placeholder { color: #9AA2B8; }
    .ai-chat-input:focus {
      border-color: #4F5EF8;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(79, 94, 248, 0.14);
    }
    .ai-chat-send {
      border-radius: 14px;
      padding: 11px 22px;
      background: linear-gradient(135deg, #4F5EF8, #5D6BFF);
      color: #FFFFFF;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.2px;
      box-shadow: 0 2px 8px rgba(79, 94, 248, 0.24);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .ai-chat-send:hover {
      background: linear-gradient(135deg, #4350E8, #4F5EF8);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(79, 94, 248, 0.3);
    }
    .ai-chat-send:disabled { opacity: 0.5; box-shadow: none; transform: none; }

    /* ---------- 10) ★★ 반응형 — 작은 화면 대응 (핵심 수정) ---------- */
    /* ai-chat.css 의 @media 는 .ai-chat-mode-floating 만 다룬다.
       full 모드는 무대응이라 min-height:560px + calc(100vh-230px) 가 화면을 넘겨
       입력줄이 뷰포트 밖으로 사라진다. 아래에서 뷰포트 기반 높이로 재정의한다. */
    .ai-chat-mode-full {
      height: 100%;
      min-height: 0;
    }
    #aiChatRoot {
      /* 부모 카드 패딩을 고려한 안전한 높이 */
      height: calc(100vh - 220px) !important;
      min-height: 420px !important;
    }

    @media (max-width: 900px) {
      #aiChatRoot { height: calc(100vh - 200px) !important; min-height: 380px !important; }
    }

    @media (max-width: 600px) {
      /* 헤더/메시지/입력 영역을 compact 하게 */
      .ai-chat-header { padding: 13px 15px; }
      .ai-chat-logo  { width: 34px; height: 34px; border-radius: 10px; }
      .ai-chat-name  { font-size: 14.5px; }
      .ai-chat-sub   { font-size: 11px; }
      .ai-chat-messages { padding: 14px 12px; gap: 11px; }
      .ai-chat-bubble { max-width: 92%; padding: 11px 14px; font-size: 13.5px; }
      .ai-chat-input-row { padding: 10px 11px; gap: 8px; }
      .ai-chat-input { padding: 10px 12px; font-size: 13.5px; }
      .ai-chat-send  { padding: 10px 16px; font-size: 13.5px; }
      /* ★ dvh 로 모바일 브라우저 주소창 변화에도 입력줄이 항상 보이게 */
      #aiChatRoot {
        height: calc(100dvh - 180px) !important;
        min-height: 340px !important;
      }
    }

    @media (max-width: 400px) {
      .ai-chat-send { padding: 10px 13px; }
      #aiChatRoot { height: calc(100dvh - 172px) !important; min-height: 300px !important; }
    }
    </style>
