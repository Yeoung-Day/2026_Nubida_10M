    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            renderSidebarUser();
            loadProfile();
            loadBranchSettings();
            loadNotifSettings();
        });
        async function loadProfile() {
            try {
                const res = await apiGet('/auth/me');
                const u = res?.data || res;
                if (u.name) document.getElementById('profileName').value = u.name;
                if (u.email) document.getElementById('profileEmail').value = u.email;
                if (u.phone) document.getElementById('profilePhone').value = u.phone;
            } catch(e) { console.warn('프로필 로드 실패', e); }
        }
        async function loadBranchSettings() {
            try {
                const res = await apiGet('/branch/settings');
                const b = res?.data || res;
                const set = (id, val) => {
                    const el = document.getElementById(id);
                    if (el && val !== undefined && val !== null) el.value = val;
                };
                set('branchName', b.name);
                set('branchPhone', b.phone);
                set('branchAddress', b.address);
                set('bankName', b.bank_name);
                set('accountNumber', b.account_number);
                set('accountHolder', b.account_holder);
            } catch(e) { console.warn('에듀케어 설정 로드 실패', e); }
        }
        async function saveAllSettings() {
            // 브랜치 정보 + 정산/입금 계좌 저장
            try {
                const branchId = getBranchId();
                if (branchId) {
                    const accountNumber = (document.getElementById('accountNumber').value || '').replace(/[^0-9]/g, '');
                    document.getElementById('accountNumber').value = accountNumber;
                    await apiPut('/branch/settings', {
                        name: document.getElementById('branchName').value,
                        phone: document.getElementById('branchPhone').value,
                        address: document.getElementById('branchAddress').value,
                        bank_name: document.getElementById('bankName').value,
                        account_number: accountNumber,
                        account_holder: document.getElementById('accountHolder').value,
                    });
                }
            } catch(e) {
                showAlert(e?.message || '에듀케어 설정 저장 실패', 'error');
                return;
            }
            // 프로필 저장
            try {
                const data = {
                    name: document.getElementById('profileName').value,
                    email: document.getElementById('profileEmail').value,
                    phone: document.getElementById('profilePhone').value,
                };
                const res = await apiPut('/auth/me', data);
                const fresh = await apiGet('/auth/me');
                if (fresh?.data) localStorage.setItem('user', JSON.stringify(fresh.data));
                renderSidebarUser();
                showAlert(res?.message || '전체 저장 완료', 'success');
                loadProfile();
            } catch(e) {
                showAlert(e?.message || '저장 실패', 'error');
            }
        }
        async function saveNotifSettings() {
            try {
                const branchId = getBranchId();
                await apiPost('/branch/notification-settings', {
                    branch_id: branchId,
                    payment: document.getElementById('notifyPayment').checked,
                    attendance: document.getElementById('notifyAttendance').checked,
                    schedule: document.getElementById('notifySchedule').checked,
                });
                showAlert('알림 설정이 저장되었습니다.', 'success');
            } catch(e) {
                showAlert(e?.message || '저장 실패', 'error');
            }
        }
        async function loadNotifSettings() {
            try {
                const res = await apiGet('/branch/notification-settings');
                const config = res?.data || res;
                if (config.payment !== undefined) document.getElementById('notifyPayment').checked = config.payment;
                if (config.attendance !== undefined) document.getElementById('notifyAttendance').checked = config.attendance;
                if (config.schedule !== undefined) document.getElementById('notifySchedule').checked = config.schedule;
            } catch(e) {
                console.warn('알림 설정 로드 실패', e);
            }
        }
        async function changePassword() {
            const oldPw = document.getElementById('pwCurrent').value;
            const newPw = document.getElementById('pwNew').value;
            const confirmPw = document.getElementById('pwConfirm').value;
            if (!oldPw || !newPw || !confirmPw) {
                showAlert('모든 필드를 입력해주세요.', 'error');
                return;
            }
            if (newPw !== confirmPw) {
                showAlert('새 비밀번호가 일치하지 않습니다.', 'error');
                return;
            }
            if (newPw.length < 4) {
                showAlert('비밀번호는 4자 이상이어야 합니다.', 'error');
                return;
            }
            try {
                const res = await apiPut('/auth/password', { old_password: oldPw, new_password: newPw });
                showAlert(res?.message || '비밀번호가 변경되었습니다.', 'success');
                document.getElementById('pwCurrent').value = '';
                document.getElementById('pwNew').value = '';
                document.getElementById('pwConfirm').value = '';
            } catch(e) {
                showAlert(e?.message || '비밀번호 변경 실패', 'error');
            }
        }
    </script>
