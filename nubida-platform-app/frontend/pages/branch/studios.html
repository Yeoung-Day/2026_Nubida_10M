            <div class="card">
                <div class="card-header"><h2>공부방 목록</h2></div>
                <div class="card-body" style="padding:0">
                    <div class="table-wrapper">
                        <table class="data-table" data-card-view>
                            <thead><tr><th>공부방명</th><th>원장명</th><th>연락처</th><th>수강생수</th><th>강좌수</th><th>상태</th><th>관리</th></tr></thead>
                            <tbody id="studioBody"><tr><td colspan="7" style="text-align:center;color:var(--text-tertiary);padding:40px">로딩 중...</td></tr></tbody>

    <div class="modal-overlay" id="studioModal">
        <div class="modal">
            <h2 id="studioModalTitle">공부방 등록</h2>
            <form id="studioForm" onsubmit="return false;">
                <input type="hidden" id="editStudioId">
                <div class="form-row">
                    <div class="form-group"><label>공부방명</label><input type="text" class="form-input" id="studioName" required></div>
                    <div class="form-group"><label>원장 계정</label>
                        <select class="form-select" id="studioDirectorId" required>
                            <option value="">선택하세요</option>
                        </select>
                    </div>
                </div>
                <div class="form-group"><label>연락처</label><input type="text" class="form-input" id="studioPhone"></div>
                <div class="form-group"><label>주소</label><input type="text" class="form-input" id="studioAddress"></div>
                <div class="form-group"><label>상태</label>
                    <select class="form-select" id="studioStatus">
                        <option value="active">운영 중</option>
                        <option value="inactive">휴업</option>
                        <option value="pending">대기</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-ghost" onclick="closeModal('studioModal')">취소</button>
                    <button type="submit" class="btn btn-primary">저장</button>
                </div>
            </form>
        </div>
    </div>
    <div class="modal-overlay" id="deleteStudioModal">
        <div class="modal modal-sm">
            <h2>공부방 삭제</h2>
            <p style="margin:16px 0;color:var(--text-secondary)">정말 이 공부방을 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.</p>
            <input type="hidden" id="deleteStudioId">
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" onclick="closeModal('deleteStudioModal')">취소</button>
                <button type="button" class="btn btn-danger" onclick="confirmDeleteStudio()">삭제</button>
            </div>
        </div>
    </div>
