/* =====================================================================
   원장 · 출결 관리 — 미니멀 리디자인 (페이지 로컬 오버라이드)
   ===================================================================== */
:root{
  --na-point:#4F5EF8;
  --na-point-soft:#EEF0FE;
  --na-bg:#FBFCFE;
  --na-line:#E8ECF5;
  --na-label:#98A1B2;
  --na-text:#1F2437;
  --na-muted:#6B7385;
  --na-s-ok:#16A34A; --na-s-ok-bg:#ECF9F1;
  --na-s-warn:#D97706; --na-s-warn-bg:#FEF6E9;
  --na-s-bad:#DC2626; --na-s-bad-bg:#FDEEEE;
  --na-s-info:#4F5EF8; --na-s-info-bg:#EEF0FE;
  --na-r-sm:6px; --na-r-md:8px; --na-r-lg:10px;
  --na-r-xl:12px; --na-r-2xl:14px; --na-r-3xl:16px;
}

/* ---------- 페이지 컨텍스트 ---------- */
.main-content{ background:var(--na-bg); }
.main-content .mb-16{ margin-bottom:16px; }
.main-content .mb-24{ margin-bottom:24px; }

/* ---------- 필터 바 : 아이콘+라벨 카드형 그리드 ---------- */
.filter-bar{
  display:grid !important;
  grid-template-columns:minmax(180px,1.2fr) minmax(160px,1fr) minmax(150px,1fr) auto;
  gap:14px 16px;
  align-items:end;
  padding:20px 22px;
  background:linear-gradient(180deg,#FBFCFE 0%,#F6F8FC 100%);
  border:1px solid var(--na-line);
  border-radius:var(--na-r-3xl);
  box-shadow:0 1px 2px rgba(31,36,55,.03);
  flex-wrap:initial;
}
.filter-bar > select,
.filter-bar > input,
.filter-bar > button{ margin:0 !important; }
/* 라벨 : 필터 요소 위에 얇은 캡션 */
.filter-bar > *{ position:relative; }
.filter-bar > select::before,
.filter-bar > input::before{ content:""; }
.filter-bar .filter-cap{
  grid-column:1 / -1;
  font-size:11px; font-weight:600; letter-spacing:.08em;
  text-transform:uppercase; color:var(--na-label);
}
.filter-bar select.form-select,
.filter-bar input.form-input{
  width:100% !important;
  height:42px;
  background:#fff;
  border:1px solid var(--na-line);
  border-radius:var(--na-r-lg);
  color:var(--na-text);
  font-size:14px;
  padding:0 12px;
  transition:border-color .15s, box-shadow .15s;
  appearance:none;
}
.filter-bar select.form-select{
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398A1B2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 12px center;
  padding-right:36px;
}
.filter-bar input.form-input[type="date"]{ padding-right:10px; }
.filter-bar select.form-select:focus,
.filter-bar input.form-input:focus{
  outline:none; border-color:var(--na-point);
  box-shadow:0 0 0 3px rgba(79,94,248,.12);
}
.filter-bar .btn{ height:42px; padding:0 20px; }

/* 필터 아이콘/라벨 오버레이 — grid 자식에 의사요소가 없는 구조 대응용
   (HTML 변경 없이 라벨은 상단 캡션 .filter-cap 별도 마크업 없음 → 미사용) */

/* ---------- 통계 카드 5개 ---------- */
.stats-grid{
  display:grid !important;
  grid-template-columns:repeat(5,1fr) !important;
  gap:16px;
}
.stat-card,
.stat-card.stat-card-accent{
  position:relative;
  display:flex; flex-direction:column; gap:10px;
  background:#fff;
  border:1px solid var(--na-line);
  border-radius:var(--na-r-2xl);
  padding:20px 20px 18px;
  box-shadow:0 1px 2px rgba(31,36,55,.03), 0 8px 20px -14px rgba(31,36,55,.18);
  overflow:hidden;
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.stat-card::before{ content:none !important; }         /* 기존 좌측 색상바 제거 */
.stat-card::after{ content:none !important; }
.stat-card:hover{
  transform:translateY(-2px);
  border-color:#DCE2EF;
  box-shadow:0 2px 4px rgba(31,36,55,.04), 0 14px 28px -16px rgba(31,36,55,.22);
}
.stat-card .stat-label{
  order:2;
  font-size:13px; font-weight:600; letter-spacing:-.01em;
  color:var(--na-label); margin:0;
}
.stat-card .stat-value{
  order:1;
  font-size:30px; font-weight:700; line-height:1;
  letter-spacing:-.03em; color:var(--na-text); margin:0;
  font-variant-numeric:tabular-nums;
}
/* 아이콘 배지 (JS 미사용 → 순수 장식 레이어) */
.stat-card::marker{ content:none; }
.stat-card .stat-label::before{
  content:"";
  display:inline-block; width:26px; height:26px;
  margin-right:9px; vertical-align:-7px;
  border-radius:var(--na-r-md);
  background-color:#F2F4F9;
  background-repeat:no-repeat; background-position:center;
  background-size:14px 14px;
}
/* 결과별 은은한 숫자 색 */
.stat-card .stat-value.success{ color:var(--na-s-ok); }
.stat-card .stat-value.warning{ color:var(--na-s-warn); }
.stat-card .stat-value.danger { color:var(--na-s-bad); }
.stat-card .stat-value.info   { color:var(--na-s-info) !important; }  /* 인라인 컬러 오버라이드 */

/* 출석 */
.stat-card.success .stat-label::before{
  background-color:var(--na-s-ok-bg);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2316A34A' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E");
}
/* 지각 */
.stat-card.warning .stat-label::before{
  background-color:var(--na-s-warn-bg);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23D97706' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cpolyline points='12 7 12 12 15 14'/%3E%3C/svg%3E");
}
/* 결석 */
.stat-card.danger .stat-label::before{
  background-color:var(--na-s-bad-bg);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%23DC2626' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='12' cy='12' r='9'/%3E%3Cline x1='9' y1='9' x2='15' y2='15'/%3E%3Cline x1='15' y1='9' x2='9' y2='15'/%3E%3C/svg%3E");
}
/* 공결 */
.stat-card.info .stat-label::before{
  background-color:var(--na-s-info-bg);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%234F5EF8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/%3E%3Cpolyline points='14 2 14 8 20 8'/%3E%3Cline x1='9' y1='15' x2='15' y2='15'/%3E%3C/svg%3E");
}
/* 출석률 (마지막 카드 — accent 클래스 없음) */
.stat-card:not(.success):not(.warning):not(.danger):not(.info) .stat-label::before{
  background-color:var(--na-point-soft);
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%234F5EF8' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 3v18h18'/%3E%3Cpath d='M7 14l3-4 3 3 5-6'/%3E%3C/svg%3E");
}

/* ---------- 카드 (테이블 래퍼) ---------- */
.card{
  background:#fff;
  border:1px solid var(--na-line);
  border-radius:var(--na-r-3xl);
  box-shadow:0 1px 2px rgba(31,36,55,.03), 0 10px 30px -22px rgba(31,36,55,.25);
  overflow:hidden;
}
.card .card-header{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 22px;
  border-bottom:1px solid var(--na-line);
  background:linear-gradient(180deg,#FFFFFF 0%,#FDFEFF 100%);
}
.card .card-header h2{
  margin:0; font-size:15px; font-weight:700;
  letter-spacing:-.01em; color:var(--na-text);
}
.card .card-header h2::before{
  content:"";
  display:inline-block; width:4px; height:15px;
  margin-right:9px; vertical-align:-2px;
  border-radius:2px; background:var(--na-point);
}
.card .card-body{ padding:0 !important; }

/* ---------- 테이블 ---------- */
.table-wrapper{ overflow-x:auto; }
.data-table{
  width:100%; border-collapse:collapse;
  font-size:13.5px; color:var(--na-text);
  background:#fff;
}
.data-table thead th{
  padding:12px 16px;
  background:#F7F9FC;
  font-size:11px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--na-label);
  text-align:left; white-space:nowrap;
  border-bottom:1px solid var(--na-line);
}
.data-table tbody td{
  padding:14px 16px;
  border-bottom:1px solid #F1F4FA;
  color:var(--na-text);
  vertical-align:middle;
}
.data-table tbody tr{ transition:background .12s ease; }
.data-table tbody tr:hover{ background:#F9FAFE; }
.data-table tbody tr:last-child td{ border-bottom:none; }
.data-table tbody td:first-child{ font-weight:600; }
.data-table .btn,
.data-table button.btn{ height:32px; padding:0 14px; font-size:12.5px; border-radius:var(--na-r-md); }

/* 상태 배지 pill */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:4px 11px; border-radius:999px;
  font-size:11.5px; font-weight:600; letter-spacing:-.01em;
  line-height:1; border:1px solid transparent; white-space:nowrap;
}
.badge::before{
  content:""; width:6px; height:6px; border-radius:50%;
  background:currentColor; opacity:.85;
}
.badge-success{ background:var(--na-s-ok-bg); color:var(--na-s-ok); border-color:#CDEEDC; }
.badge-warning{ background:var(--na-s-warn-bg); color:var(--na-s-warn); border-color:#F8E2BC; }
.badge-danger { background:var(--na-s-bad-bg); color:var(--na-s-bad); border-color:#F7CFCF; }
.badge-info,
.badge-primary{ background:var(--na-s-info-bg); color:var(--na-s-info); border-color:#D7DCFB; }
.badge-secondary,
.badge-default{ background:#F2F4F9; color:var(--na-muted); border-color:#E4E8F1; }

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center;
  gap:7px; height:40px; padding:0 18px;
  border-radius:var(--na-r-lg);
  font-size:13.5px; font-weight:600; letter-spacing:-.01em;
  border:1px solid transparent; cursor:pointer;
  transition:background .15s, border-color .15s, box-shadow .15s, transform .1s;
}
.btn:active{ transform:translateY(1px); }
.btn.btn-primary{
  background:var(--na-point); color:#fff;
  box-shadow:0 6px 16px -8px rgba(79,94,248,.6);
}
.btn.btn-primary:hover{ background:#4452E8; }
.btn.btn-outline{
  background:#fff; color:#3A4258; border-color:var(--na-line);
}
.btn.btn-outline:hover{ border-color:#D3DAE8; background:#F8FAFD; }
.btn.btn-ghost{
  background:transparent; color:var(--na-muted); border-color:transparent;
}
.btn.btn-ghost:hover{ background:#F2F4F9; color:var(--na-text); }
.btn.btn-sm{ height:36px; padding:0 15px; font-size:13px; }

/* ---------- 모달 ---------- */
.modal-overlay{
  background:rgba(23,28,45,.42);
  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}
.modal{
  border:1px solid var(--na-line);
  border-radius:var(--na-r-3xl);
  box-shadow:0 24px 60px -20px rgba(20,25,45,.45);
  background:#fff;
  padding:26px 26px 22px;
}
.modal h2{
  margin:0 0 20px;
  font-size:18px; font-weight:700; letter-spacing:-.02em; color:var(--na-text);
}
.modal .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.modal .form-group{ margin-bottom:16px; }
.modal .form-group > label{
  display:block; margin-bottom:7px;
  font-size:12px; font-weight:600; letter-spacing:.02em; color:var(--na-label);
}
.modal .form-select,
.modal .form-input,
.modal .form-textarea{
  width:100%; background:#fff;
  border:1px solid var(--na-line);
  border-radius:var(--na-r-lg);
  color:var(--na-text); font-size:14px;
  padding:0 12px; transition:border-color .15s, box-shadow .15s;
}
.modal .form-select,
.modal .form-input{ height:42px; }
.modal .form-textarea{ padding:11px 12px; line-height:1.55; resize:vertical; }
.modal .form-select{
  appearance:none;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2398A1B2' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
  background-repeat:no-repeat; background-position:right 12px center;
  padding-right:36px;
}
.modal .form-select:focus,
.modal .form-input:focus,
.modal .form-textarea:focus{
  outline:none; border-color:var(--na-point);
  box-shadow:0 0 0 3px rgba(79,94,248,.12);
}
.modal .modal-actions{
  display:flex; justify-content:flex-end; gap:10px;
  margin-top:8px; padding-top:18px;
  border-top:1px solid var(--na-line);
}

/* ---------- 반응형 ---------- */
@media (max-width:1100px){
  .stats-grid{ grid-template-columns:repeat(3,1fr) !important; }
}
@media (max-width:820px){
  .filter-bar{ grid-template-columns:1fr 1fr; }
  .filter-bar .btn{ grid-column:1 / -1; }
  .stats-grid{ grid-template-columns:repeat(2,1fr) !important; }
}
@media (max-width:560px){
  .filter-bar{ grid-template-columns:1fr; }
  .stats-grid{ grid-template-columns:1fr !important; }
  .modal .form-row{ grid-template-columns:1fr; }
}
</style>
</head>

                            <option value="excused">공결</option>
