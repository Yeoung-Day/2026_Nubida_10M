<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const sectionMap = {
        'contracts.html': 'consult', 'portfolio-templates.html': 'report',
        'withdrawn-students.html': 'system', 'lecture-editor.html': 'eduops',
        'branches.html': 'consult', 'categories.html': 'eduops',
        'academy-management.html': 'consult', 'courses.html': 'eduops', 'users.html': 'consult',
        'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
        'director-reports.html': 'report', 'notices.html': 'system',
        'edu-materials.html': 'eduops', 'portfolio.html': 'report',
        'approvals.html': 'system', 'settings.html': 'system', 'site-manager.html': 'site', 'chat.html': 'system',
        'category-manager.html': 'system', 'category.html': 'system',
        'inquiries.html': 'eduops',
    };
    const currentSection = sectionMap[currentPage];
    if (currentSection) {
        const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
        if (toggle) { toggle.classList.add('open'); const sub = document.getElementById(`sub-${currentSection}`); if (sub) sub.classList.add('open'); }
    }
    document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const section = this.dataset.section;
            const sub = document.getElementById(`sub-${section}`);
            if (!sub) return;
            const isOpen = sub.classList.contains('open');
            if (isOpen) { sub.classList.remove('open'); this.classList.remove('open'); }
            else {
                document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
                sub.classList.add('open'); this.classList.add('open');
            }
        });
    });
    document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href && href === currentPage) item.classList.add('active');
    });
});
</script>

   <p style="font-size:14px;color:#6B7280;margin-bottom:16px">
   아래 카테고리 중 해당 학원(원장)에게 노출할 강좌 카테고리를 선택하세요.
   </p>
   <div class="cat-grid" id="categoryToggleList" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
   <div style="grid-column:1/-1;text-align:center;padding:40px 0;color:#9CA3AF">카테고리 정보를 불러오는 중...</div>
   </div>
   <div style="margin-top:20px;display:flex;gap:8px;justify-content:flex-end">
   <button class="btn btn-outline btn-sm" onclick="toggleAllCategories(true)">모두 선택</button>
   <button class="btn btn-outline btn-sm" onclick="toggleAllCategories(false)">모두 해제</button>
   <button class="btn btn-primary btn-sm" onclick="saveCategoryPermissions()">💾 권한 저장</button>
   </div>
   </div>
   </div>

   </main>
   </div>

<script src="/common/js/api.js?v=20260918abort"></script>
<script src="/common/js/auth.js?v=20260911nav"></script>
<script>
/* ===== 상태 변수 ===== */
let currentPage = 1;
let totalPages = 1;
let searchTimer = null;
let selectedDirectorId = null;
let selectedDirectorName = '';
let allCategories = [];
let allFolders = [];        // 전체 폴더 트리 (폴더 단위 권한 선택용)
let catCourseIdsMap = {};   // catKey → Set(해당 카테고리 강좌 id) (폴더-강좌 필터용)

/* ===== 초기화 ===== */
document.addEventListener('DOMContentLoaded', async function() {
    const token = localStorage.getItem('token') || localStorage.getItem('access_token');
    if (!token) { window.location.href = '/pages/login.html'; return; }
    if (typeof renderSidebarUser === 'function') renderSidebarUser();
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
    document.getElementById('pageLoading')?.classList.add('hide');
    await loadRegionOptions();
    await loadDirectors(1);
});

/* ===== 유틸 ===== */
function esc(s) { if (s == null) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ===== 지역/분류 옵션 로드 ===== */
async function loadRegionOptions() {
    // 현재 선택값 보존
    const prevRegion = document.getElementById('regionFilter').value;
    const prevType = document.getElementById('typeFilter').value;
    try {
        // 지역 옵션: 전용 API로 로드
        const regionRes = await apiGet('/headquarters/regions');
        const regions = regionRes.data || [];
        const regionSel = document.getElementById('regionFilter');
        regionSel.innerHTML = '<option value="">전체 지역</option>';
        regions.forEach(r => {
            regionSel.innerHTML += `<option value="${esc(r)}">${esc(r)}</option>`;
        });

        // 분류(academy_type) 옵션: categories API에서 모든 카테고리명을 가져옴
        // (directors/list는 페이지네이션 제한이 있으므로 categories API 사용)
        const typeSel = document.getElementById('typeFilter');
        typeSel.innerHTML = '<option value="">전체 분류</option>';
        
        try {
            const catRes = await apiGet('/headquarters/categories');
            const cats = catRes.data || [];
            const typeNames = [...new Set(cats.map(c => c.name).filter(Boolean))].sort();
            typeNames.forEach(name => {
                typeSel.innerHTML += `<option value="${esc(name)}">${esc(name)}</option>`;
            });
        } catch(e) { /* categories fetch is optional */ }

        // 선택값 복원
        if (prevRegion) document.getElementById('regionFilter').value = prevRegion;
        if (prevType) document.getElementById('typeFilter').value = prevType;
    } catch(e) {}
}

/* ===== 원장 목록 로드 ===== */
async function loadDirectors(page) {
    currentPage = page || 1;
    const tbody = document.getElementById('directorTableBody');
    if (!tbody) return;
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#9CA3AF">로딩 중...</td></tr>';

    try {
        const search = document.getElementById('searchInput').value.trim();
        const type = document.getElementById('typeFilter').value;
        const region = document.getElementById('regionFilter').value;

        let path = '/headquarters/directors/list?page=' + currentPage + '&per_page=20';
        if (search) path += '&search=' + encodeURIComponent(search);
        if (type) path += '&academy_type=' + encodeURIComponent(type);
        if (region) path += '&region=' + encodeURIComponent(region);

        const res = await apiGet(path);
        const data = Array.isArray(res.data) ? res.data : (res.data ? Object.values(res.data) : []);
        // directors/list는 total/total_pages 필드를 반환하지 않으므로 배열 길이로 fallback
        const total = res.total !== undefined ? res.total : (res.pagination ? res.pagination.total : data.length);
        const perPage = res.per_page || 20;
        const totalPages = res.total_pages !== undefined ? res.total_pages : (res.pagination ? res.pagination.total_pages : Math.max(1, Math.ceil(total / perPage)));
        const pagination = { total: total, total_pages: totalPages, page: res.page || 1, per_page: perPage };

        document.getElementById('directorCount').textContent = pagination.total + '명';

        if (!data || data.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#9CA3AF">등록된 학원(원장)이 없습니다</td></tr>';
            renderPagination(pagination);
            return;
        }

        tbody.innerHTML = data.map(d => {
            const typeBadge = d.academy_type ? `<span class="badge badge-info">${esc(d.academy_type)}</span>` : '<span class="badge badge-secondary">-</span>';
            return '<tr>' +
                '<td>' + d.id + '</td>' +
                '<td><strong>' + esc(d.name) + '</strong></td>' +
                '<td style="font-size:12px">' + esc(d.email || '-') + '</td>' +
                '<td>' + esc(d.phone || '-') + '</td>' +
                '<td>' + typeBadge + '</td>' +
                '<td>' + esc(d.region || '-') + '</td>' +
                '<td><button class="btn btn-sm btn-primary" onclick="openCategoryPanel(' + d.id + ', \'' + esc(d.name) + '\')">📚 카테고리 설정</button></td>' +
                '</tr>';
        }).join('');

        renderPagination(pagination);
    } catch(e) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:24px;color:#EF4444">오류: ' + esc(e.message) + '</td></tr>';
    }
}

function filterDirectors() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; loadDirectors(1); }, 400);
}

function renderPagination(pagination) {
    const container = document.getElementById('paginationWrap');
    if (!container) return;
    const totalPages = pagination.total_pages || 1;
    if (totalPages <= 1) { container.innerHTML = ''; return; }
    const page = currentPage;
    let html = '<div class="pagination" style="display:flex;gap:4px;justify-content:center;margin-top:16px">';
    html += '<button class="btn btn-sm ' + (page <= 1 ? 'btn-ghost" disabled' : 'btn-outline') + '" onclick="loadDirectors(1)">«</button>';
    html += '<button class="btn btn-sm ' + (page <= 1 ? 'btn-ghost" disabled' : 'btn-outline') + '" onclick="loadDirectors(' + (page-1) + ')">‹</button>';
    for (let i = Math.max(1, page-2); i <= Math.min(totalPages, page+2); i++) {
        html += '<button class="btn btn-sm ' + (i === page ? 'btn-primary' : 'btn-outline') + '" onclick="loadDirectors(' + i + ')">' + i + '</button>';
    }
    html += '<button class="btn btn-sm ' + (page >= totalPages ? 'btn-ghost" disabled' : 'btn-outline') + '" onclick="loadDirectors(' + (page+1) + ')">›</button>';
    html += '<button class="btn btn-sm ' + (page >= totalPages ? 'btn-ghost" disabled' : 'btn-outline') + '" onclick="loadDirectors(' + totalPages + ')">»</button>';
    html += '</div>';
    container.innerHTML = html;
}

/* ===== 카테고리 권한 패널 ===== */
async function openCategoryPanel(directorId, directorName) {
    selectedDirectorId = directorId;
    selectedDirectorName = directorName;
    document.getElementById('categoryPanel').style.display = 'block';
    document.getElementById('catPanelTitle').textContent = '📚 ' + esc(directorName) + ' — 강좌 카테고리 권한 설정';

    const container = document.getElementById('categoryToggleList');
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:#9CA3AF">카테고리 정보를 불러오는 중...</div>';

    try {
        // Get all categories
        const catRes = await apiGet('/headquarters/categories');
        const categories = catRes.data || [];
        allCategories = categories;

        // 전체 폴더 트리 로드 (폴더 단위 권한 선택용)
        allFolders = [];
        catCourseIdsMap = {};
        try {
            const folderRes = await apiGet('/headquarters/folders');
            allFolders = folderRes.data || [];
        } catch (fe) { /* 폴더 로드 실패 시 폴더 섹션만 미표시 (기존 동작 유지) */ }

        // Get director's permissions
        const permRes = await apiGet('/headquarters/directors/' + directorId + '/categories');
        const permData = permRes.data || {};

        const allowedKeys = new Set();
        (permData.categories || []).forEach(c => {
            if (c.is_active) allowedKeys.add(c.key);
        });
        const linkedCourseIds = new Set(permData.course_ids || []);

        const allowedCount = allowedKeys.size;
        document.getElementById('catCountInfo').textContent = '카테고리 ' + allowedCount + ' / ' + categories.length + '개 · 강좌 ' + linkedCourseIds.size + '개';

        if (!categories.length) {
            container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:#9CA3AF">등록된 카테고리가 없습니다</div>';
            return;
        }

        container.innerHTML = categories.map(cat => {
            const checked = allowedKeys.has(cat.key) ? 'checked' : '';
            const bgStyle = checked ? 'background:#EFF6FF' : 'background:white';
            const courses = cat.courses || [];
            catCourseIdsMap[cat.key] = new Set(courses.map(c => c.id));

            // 📁 폴더 단위 선택 섹션 (해당 카테고리 + 공용 폴더만)
            const folderNodes = renderFolderNodes(allFolders, cat.key, linkedCourseIds, catCourseIdsMap[cat.key], courses);
            const folderSection = folderNodes
                ? '<div style="margin:4px 0 8px;padding:6px 8px;background:#F1F5F9;border-radius:6px">' +
                  '<div style="font-size:11px;font-weight:600;color:#475569;margin-bottom:4px">📁 폴더 단위 선택 — 폴더를 체크하면 안의 강좌 전체가 권한 설정됩니다</div>' +
                  '<div style="display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto">' + folderNodes + '</div>' +
                  '</div>'
                : '';

            // 📄 폴더에 속하지 않은(미분류) 활성 강좌만 개별 표시 — 폴더로 관리되는 강좌는 개별 나열하지 않음
            const folderCourseIds = new Set();
            (function collectFolderIds(folds) {
                (folds || []).forEach(f => {
                    if (f.category === cat.key || f.category === null || !f.category) {
                        (f.course_ids || []).forEach(cid => folderCourseIds.add(cid));
                    }
                    collectFolderIds(f.children);
                });
            })(allFolders);
            const unassigned = courses.filter(c => !folderCourseIds.has(c.id));
            const unassignedSection = unassigned.length
                ? '<div style="margin:4px 0 8px;padding:6px 8px;background:#FEF9C3;border-radius:6px">' +
                  '<div style="font-size:11px;font-weight:600;color:#854D0E;margin-bottom:4px">📄 폴더 없는 강좌 (미분류) — 개별 선택</div>' +
                  '<div style="display:flex;flex-direction:column;gap:3px;max-height:160px;overflow-y:auto">' +
                  unassigned.map(cs => {
                      const cChecked = linkedCourseIds.has(cs.id) ? 'checked' : '';
                      return '<label style="display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:12px;background:#fff;border:1px solid #F0F1F5">' +
                          '<input type="checkbox" class="course-perm-cb" data-cat="' + cat.key + '" value="' + cs.id + '" ' + cChecked + ' onchange="onCategoryCheckChange()">' +
                          '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(cs.name) + '</span>' +
                          '</label>';
                  }).join('') +
                  '</div></div>'
                : '';

            const emptyHint = (!folderSection && !unassignedSection)
                ? '<div style="font-size:11px;color:#9CA3AF;padding:4px 8px">이 카테고리에 선택 가능한 강좌/폴더가 없습니다</div>'
                : '';

            return '<div class="cat-card" style="border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;' + (checked ? 'box-shadow:0 0 0 1px #BFDBFE' : '') + '" id="cat-card-' + esc(cat.key) + '">' +
                '<label class="cat-toggle" style="display:flex;align-items:flex-start;gap:8px;padding:10px 14px;cursor:pointer;' + bgStyle + '">' +
                '<input type="checkbox" class="cat-perm-cb" value="' + cat.id + '" data-key="' + cat.key + '" ' + checked + ' onchange="onCategoryCheckChange()">' +
                '<div style="flex:1;min-width:0">' +
                '<div style="display:flex;align-items:center;gap:6px">' +
                '<span style="font-size:14px;font-weight:500">' + esc(cat.name) + '</span>' +
                (cat.color ? '<span style="width:10px;height:10px;border-radius:50%;background:' + cat.color + ';display:inline-block;flex-shrink:0"></span>' : '') +
                '<span style="font-size:11px;color:#9CA3AF;margin-left:auto">' + (cat.course_count || 0) + '개 강좌</span>' +
                '</div>' +
                '</div>' +
                '</label>' +
                '<div class="cat-courses" id="cat-courses-' + esc(cat.key) + '" style="display:' + (checked ? 'block' : 'none') + ';padding:8px 12px 12px;background:#F8FAFC;border-top:1px solid #F0F1F5">' +
                folderSection +
                unassignedSection +
                emptyHint +
                '</div>' +
                '</div>';
        }).join('');
    } catch(e) {
        container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px 0;color:#EF4444">오류: ' + esc(e.message) + '</div>';
    }
}

function onCategoryCheckChange() {
    const checkboxes = document.querySelectorAll('.cat-perm-cb');
    const checked = Array.from(checkboxes).filter(cb => cb.checked).length;
    // 카테고리 체크 상태에 따라 강좌 목록 펼침/접기
    document.querySelectorAll('.cat-perm-cb').forEach(cb => {
        const key = cb.dataset.key;
        const coursesEl = document.getElementById('cat-courses-' + key);
        const cardEl = document.getElementById('cat-card-' + key);
        if (coursesEl) coursesEl.style.display = cb.checked ? 'block' : 'none';
        if (cardEl) cardEl.style.boxShadow = cb.checked ? '0 0 0 1px #BFDBFE' : 'none';
    });
    // 📁 폴더 체크 상태 동기화 — 개별 강좌 변경 시 폴더 안 강좌가 전부 체크되면 폴더 on, 아니면 off
    document.querySelectorAll('.folder-perm-cb').forEach(fcb => {
        const catKey = fcb.dataset.cat;
        const folder = findFolderById(parseInt(fcb.dataset.folder));
        const catCourseIds = catCourseIdsMap[catKey] || new Set();
        if (!folder) { fcb.checked = false; return; }
        const visibleIds = (folder.course_ids || []).filter(cid => catCourseIds.has(cid));
        if (!visibleIds.length) { fcb.checked = false; return; }
        const allOn = visibleIds.every(cid => {
            const c = document.querySelector('.course-perm-cb[data-cat="' + catKey + '"][value="' + cid + '"]');
            return c ? c.checked : false;
        });
        fcb.checked = allOn;
    });
    // 강좌 카운트 — 폴더 펼침에 중복 표시된 체크박스는 Set으로 중복 제거
    const courseChecked = new Set(
        Array.from(document.querySelectorAll('.course-perm-cb')).filter(cb => cb.checked).map(cb => parseInt(cb.value))
    ).size;
    document.getElementById('catCountInfo').textContent = '카테고리 ' + checked + ' / ' + allCategories.length + '개 · 강좌 ' + courseChecked + '개';
}

function toggleCategoryCourses(catKey, select) {
    document.querySelectorAll('.course-perm-cb[data-cat="' + catKey + '"]').forEach(cb => {
        cb.checked = select;
    });
    onCategoryCheckChange();
}

/* ===== 📁 폴더 단위 선택 ===== */

// 폴더 트리 재귀 렌더링 (해당 카테고리 + 공용 폴더만)
function renderFolderNodes(folders, catKey, linkedIds, catCourseIds, catCourses) {
    const list = (folders || []).filter(f => f.category === catKey || f.category === null || !f.category);
    if (!list.length) return '';
    let html = '';
    list.forEach(f => {
        const fId = f.id;
        // 이 카테고리 화면에 보이는 폴더 내 강좌 (자식 포함)
        const visibleIds = (f.course_ids || []).filter(cid => catCourseIds && catCourseIds.has(cid));
        // 폴더 체크 상태: 보이는 강좌가 전부 권한 연결되어 있으면 on
        const fChecked = visibleIds.length > 0 && visibleIds.every(cid => linkedIds.has(cid)) ? 'checked' : '';
        // 직접 소속 강좌 중 이 카테고리에서 보이는 것 (펼치기 시 개별 표시)
        const directVisible = (f.direct_course_ids || []).filter(cid => catCourseIds && catCourseIds.has(cid));

        html += '<div style="margin:1px 0">' +
            '<label style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:12px;background:#fff;border:1px solid #E2E8F0">' +
            '<input type="checkbox" class="folder-perm-cb" data-folder="' + fId + '" data-cat="' + catKey + '" ' + fChecked + ' onchange="onFolderCheckChange(this)">' +
            '<span class="folder-arrow" id="folder-arrow-' + catKey + '-' + fId + '" style="cursor:pointer;font-size:12px;flex-shrink:0" onclick="toggleFolderExpand(\'' + catKey + '\',' + fId + ')">📁</span>' +
            '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer" onclick="toggleFolderExpand(\'' + catKey + '\',' + fId + ')">' + esc(f.name) + '</span>' +
            '<span style="font-size:10px;color:#9CA3AF;flex-shrink:0">' + visibleIds.length + '개</span>' +
            '</label>' +
            '<div class="folder-courses" id="folder-courses-' + catKey + '-' + fId + '" style="display:none;margin-left:20px;padding-left:8px;border-left:1px dashed #CBD5E1">';

        // 직접 소속 강좌 개별 체크박스 (course-perm-cb 재사용 → 저장 시 자동 수집)
        directVisible.forEach(cid => {
            const cObj = (catCourses || []).find(c => c.id === cid);
            const cChecked = linkedIds.has(cid) ? 'checked' : '';
            html += '<label style="display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:11px;background:#fff;border:1px solid #F0F1F5;margin-top:2px">' +
                '<input type="checkbox" class="course-perm-cb" data-cat="' + catKey + '" value="' + cid + '" ' + cChecked + ' onchange="onCategoryCheckChange()">' +
                '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(cObj ? cObj.name : ('강좌 #' + cid)) + '</span>' +
                '</label>';
        });

        // 자식 폴더 재귀
        const childHtml = renderFolderNodes(f.children, catKey, linkedIds, catCourseIds, catCourses);
        if (childHtml) html += childHtml;
        html += '</div></div>';
    });
    return html;
}

// 폴더 펼치기/접기 (카테고리별 id 고유화: folder-courses-{catKey}-{folderId})
function toggleFolderExpand(catKey, folderId) {
    const el = document.getElementById('folder-courses-' + catKey + '-' + folderId);
    const arrow = document.getElementById('folder-arrow-' + catKey + '-' + folderId);
    if (!el) return;
    const show = el.style.display === 'none';
    el.style.display = show ? 'block' : 'none';
    if (arrow) arrow.textContent = show ? '📂' : '📁';
}

// 폴더 체크 on/off → 폴더 안 강좌 전체 선택/해제
function onFolderCheckChange(cb) {
    const folderId = parseInt(cb.dataset.folder);
    const catKey = cb.dataset.cat;
    const folder = findFolderById(folderId);
    if (!folder) return;
    const checked = cb.checked;
    const catCourseIds = catCourseIdsMap[catKey] || new Set();
    (folder.course_ids || []).forEach(cid => {
        if (!catCourseIds.has(cid)) return; // 이 카테고리 화면에 없는 강좌는 건드리지 않음
        document.querySelectorAll('.course-perm-cb[data-cat="' + catKey + '"][value="' + cid + '"]').forEach(c => {
            c.checked = checked;
        });
    });
    onCategoryCheckChange();
}

// 폴더 id로 트리에서 폴더 객체 찾기
function findFolderById(id) {
    function search(list) {
        for (const f of (list || [])) {
            if (f.id === id) return f;
            const found = search(f.children);
            if (found) return found;
        }
        return null;
    }
    return search(allFolders);
}

function toggleAllCategories(select) {
    document.querySelectorAll('.cat-perm-cb').forEach(cb => {
        cb.checked = select;
        const key = cb.dataset.key;
        const coursesEl = document.getElementById('cat-courses-' + key);
        const cardEl = document.getElementById('cat-card-' + key);
        if (coursesEl) coursesEl.style.display = select ? 'block' : 'none';
        if (cardEl) cardEl.style.boxShadow = select ? '0 0 0 1px #BFDBFE' : 'none';
        if (select) toggleCategoryCourses(key, true);
    });
    onCategoryCheckChange();
}

async function saveCategoryPermissions() {
    if (!selectedDirectorId) { alert('학원을 선택하세요'); return; }
    const checkboxes = document.querySelectorAll('.cat-perm-cb');
    const categories = Array.from(checkboxes).map(cb => ({
        key: cb.dataset.key,
        category_id: parseInt(cb.value),
        is_active: cb.checked,
    }));
    // ▸ 활성 카테고리의 키 목록 (해지된 카테고리의 강좌 체크박스는 무시)
    const activeCatKeys = new Set(Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.dataset.key));
    // 강좌 단위 선택 (이중 선택) — 활성 카테고리 내 개별 강좌만 연결
    // 해지된 카테고리의 강좌는 아무리 체크되어 있어도 보내지 않음 → 서버에서 해제됨
    const courseIds = Array.from(new Set(
        Array.from(document.querySelectorAll('.course-perm-cb'))
            .filter(cb => cb.checked && activeCatKeys.has(cb.dataset.cat))
            .map(cb => parseInt(cb.value))
    ));

    try {
        await apiPut('/headquarters/directors/' + selectedDirectorId + '/categories', { categories, courses: courseIds });
        showAlert('✅ ' + selectedDirectorName + '의 카테고리 권한이 저장되었습니다. (강좌 ' + courseIds.length + '개)', 'success');
        loadDirectors(currentPage);
        // 패널 실시간 리프레시 — 저장된 데이터로 체크박스 상태 재로드
        openCategoryPanel(selectedDirectorId, selectedDirectorName);
        // 분류 필터 리프레시 — 카테고리 변경사항 반영
        loadRegionOptions();
    } catch(e) {
        showAlert('❌ 저장 실패: ' + e.message, 'error');
    }
}

/* ===== academy_type 자동 매핑 ===== */
async function autoMapCategories() {
    if (!selectedDirectorId) { showAlert('학원을 선택하세요', 'error'); return; }
    if (!confirm(selectedDirectorName + '의 academy_type에 맞게 카테고리 권한을 자동 설정하시겠습니까?')) return;
    try {
        const res = await apiPost('/headquarters/directors/' + selectedDirectorId + '/auto-map-categories');
        const data = res.data || {};
        showAlert('✅ ' + data.director_name + ' — ' + (data.activated_categories || []).join(', ') + ' 활성화 (' + data.note + ')', 'success');
        openCategoryPanel(selectedDirectorId, selectedDirectorName);
    } catch(e) {
        showAlert('❌ 자동매핑 실패: ' + e.message, 'error');
    }
}

/* ===== 페이지 이동 ===== */
function goToPage(page) { loadDirectors(page); }
