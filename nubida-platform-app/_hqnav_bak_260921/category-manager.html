<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const sectionMap = {
        'contracts.html': 'consult', 'portfolio-templates.html': 'report',
        'withdrawn-students.html': 'system', 'lecture-editor.html': 'eduops',
        'branches.html': 'consult', 'categories.html': 'eduops',
        'academy-management.html': 'consult', 'courses.html': 'eduops', 'users.html': 'consult',
        'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
        'director-reports.html': 'report', 'notices.html': 'system',
        'edu-materials.html': 'eduops', 'portfolio.html': 'report',
        'approvals.html': 'system', 'settings.html': 'system', 'site-manager.html': 'site', 'chat.html': 'system',
        'category-manager.html': 'system', 'category.html': 'system',
        'inquiries.html': 'eduops',
    };
    const currentSection = sectionMap[currentPage];
    if (currentSection) {
        const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
        if (toggle) { toggle.classList.add('open'); const sub = document.getElementById(`sub-${currentSection}`); if (sub) sub.classList.add('open'); }
    }
    document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const section = this.dataset.section;
            const sub = document.getElementById(`sub-${section}`);
            if (!sub) return;
            const isOpen = sub.classList.contains('open');
            if (isOpen) { sub.classList.remove('open'); this.classList.remove('open'); }
            else {
                document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
                sub.classList.add('open'); this.classList.add('open');
            }
        });
    });
    document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href && href === currentPage) item.classList.add('active');
    });
});
</script>

   container.innerHTML = html;
   container.querySelectorAll('.nav-item').forEach(function(a) {
   if (a.getAttribute('href') === 'category-manager.html') a.classList.add('active');
   });
   })
   .catch(function() {});
   }

   async function loadCategories() {
   try {
   var res = await apiGet('/headquarters/categories');
   allCats = res.data || [];
   renderCategories();
   } catch (err) {
   document.getElementById('catTableBody').innerHTML = '<tr><td colspan="9" class="cat-empty">❌ 로딩 실패: ' + esc(err.message) + '</td></tr>';
   }
   }

   function renderCategories() {
   var tbody = document.getElementById('catTableBody');
   if (allCats.length === 0) {
   tbody.innerHTML = '<tr><td colspan="9" class="cat-empty">📭 등록된 카테고리가 없습니다.</td></tr>';
   return;
   }
   var html = '';
   allCats.forEach(function(c, idx) {
   var isActive = c.is_active !== false;
   var iconMap = {
   'ai_art': '🎨', 'ai_robot': '🤖'
   };
   var icon = iconMap[c.key] || '📁';
   html += '<tr>';
   html += '<td style="font-size:12px;color:var(--text-tertiary)">' + (idx + 1) + '</td>';
   html += '<td><span style="font-size:18px">' + icon + '</span></td>';
   html += '<td><strong>' + esc(c.name) + '</strong></td>';
   html += '<td style="font-size:12px;color:var(--text-tertiary)">' + esc(c.key) + '</td>';
   var color = c.color || '#4F5EF8';
   var bgColor = c.bg_color || 'rgba(8,145,178,0.08)';
   html += '<td><span class="color-preview" style="background:' + color + '"></span></td>';
   html += '<td style="text-align:center;font-weight:600">' + (c.course_count || 0) + '</td>';
   html += '<td style="text-align:center">' + (c.folder_count || 0) + '</td>';
   html += '<td><span class="badge badge-' + (isActive ? 'success' : 'default') + '">' + (isActive ? '활성' : '비활성') + '</span></td>';
   html += '<td class="actions">';
   html += '<button class="btn btn-ghost btn-xs" onclick="openEditModal(' + c.id + ')">✏️</button>';
   html += '<button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="deleteCategory(' + c.id + ',\'' + esc(c.name) + '\',' + (c.course_count || 0) + ')">🗑️</button>';
   html += '</td></tr>';
   });
   tbody.innerHTML = html;
   }

   function openCreateModal() {
   document.getElementById('editCategoryId').value = '';
   document.getElementById('categoryModalTitle').textContent = '➕ 새 카테고리';
   document.getElementById('catName').value = '';
   document.getElementById('catKey').value = '';
   document.getElementById('catColor').value = '#2563EB';
   document.getElementById('catColorHex').value = '#2563EB';
   document.getElementById('catBgColor').value = '#EFF6FF';
   document.getElementById('catBgColorHex').value = '#EFF6FF';
   document.getElementById('catSortOrder').value = allCats.length + 1;
   openModal('categoryModal');
   setTimeout(function() { document.getElementById('catName').focus(); }, 100);
   }

   function openEditModal(id) {
   var c = allCats.find(function(x) { return x.id === id; });
   if (!c) { showAlert('카테고리 정보 없음', 'error'); return; }
   document.getElementById('editCategoryId').value = c.id;
   document.getElementById('categoryModalTitle').textContent = '✏️ ' + c.name + ' 수정';
   document.getElementById('catName').value = c.name || '';
   document.getElementById('catKey').value = c.key || '';
   document.getElementById('catColor').value = c.color || '#2563EB';
   document.getElementById('catColorHex').value = c.color || '#2563EB';
   document.getElementById('catBgColor').value = c.bg_color || '#EFF6FF';
   document.getElementById('catBgColorHex').value = c.bg_color || '#EFF6FF';
   document.getElementById('catSortOrder').value = c.sort_order || 0;
   openModal('categoryModal');
   }

   // Sync color picker ↔ hex input
   document.addEventListener('DOMContentLoaded', function() {
   document.getElementById('catColor').addEventListener('input', function() {
   document.getElementById('catColorHex').value = this.value;
   });
   document.getElementById('catColorHex').addEventListener('input', function() {
   if (/^#[0-9a-fA-F]{6}$/.test(this.value)) {
   document.getElementById('catColor').value = this.value;
   }
   });
   document.getElementById('catBgColor').addEventListener('input', function() {
   document.getElementById('catBgColorHex').value = this.value;
   });
   document.getElementById('catBgColorHex').addEventListener('input', function() {
   if (/^#[0-9a-fA-F]{6}$/.test(this.value)) {
   document.getElementById('catBgColor').value = this.value;
   }
   });
   });

   async function saveCategory() {
   var editId = document.getElementById('editCategoryId').value;
   var name = document.getElementById('catName').value.trim();
   var key = document.getElementById('catKey').value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '_');
   var color = document.getElementById('catColorHex').value.trim() || null;
   var bgColor = document.getElementById('catBgColorHex').value.trim() || null;
   var sortOrder = parseInt(document.getElementById('catSortOrder').value) || 0;
   if (!name || !key) { showAlert('이름과 키는 필수입니다.', 'error'); return; }
   try {
   if (editId) {
   await apiPut('/headquarters/categories/' + editId, {
   name: name, key: key, color: color, bg_color: bgColor, sort_order: sortOrder
   });
   showAlert('카테고리가 수정되었습니다.', 'success');
   } else {
   await apiPost('/headquarters/categories', {
   key: key, name: name, color: color, bg_color: bgColor, sort_order: sortOrder
   });
   showAlert('카테고리가 생성되었습니다.', 'success');
   }
   closeModal('categoryModal');
   await loadCategories();
   } catch (err) { showAlert(err.message || '저장 실패', 'error'); }
   }

   async function deleteCategory(id, name, courseCount) {
   if (courseCount > 0) {
   showAlert('"' + name + '" 카테고리에 ' + courseCount + '개의 강좌가 연결되어 있어 삭제할 수 없습니다. 먼저 강좌를 다른 카테고리로 이동해주세요.', 'error');
   return;
   }
   if (!confirm('"' + name + '" 카테고리를 삭제하시겠습니까?\n연결된 폴더는 자동으로 전체공용으로 변경됩니다.')) return;
   try {
   await apiDelete('/headquarters/categories/' + id);
   showAlert('"' + name + '" 카테고리가 삭제되었습니다.', 'success');
   await loadCategories();
   } catch (err) { showAlert(err.message || '삭제 실패', 'error'); }
   }
   </script>
