<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const sectionMap = {
        'contracts.html': 'consult', 'portfolio-templates.html': 'report',
        'withdrawn-students.html': 'system', 'lecture-editor.html': 'eduops',
        'branches.html': 'consult', 'categories.html': 'eduops',
        'academy-management.html': 'consult', 'courses.html': 'eduops', 'users.html': 'consult',
        'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
        'director-reports.html': 'report', 'notices.html': 'system',
        'edu-materials.html': 'eduops', 'portfolio.html': 'report',
        'approvals.html': 'system', 'settings.html': 'system', 'site-manager.html': 'site', 'chat.html': 'system',
        'category-manager.html': 'system', 'category.html': 'system',
        'inquiries.html': 'eduops',
    };
    const currentSection = sectionMap[currentPage];
    if (currentSection) {
        const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
        if (toggle) { toggle.classList.add('open'); const sub = document.getElementById(`sub-${currentSection}`); if (sub) sub.classList.add('open'); }
    }
    document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const section = this.dataset.section;
            const sub = document.getElementById(`sub-${section}`);
            if (!sub) return;
            const isOpen = sub.classList.contains('open');
            if (isOpen) { sub.classList.remove('open'); this.classList.remove('open'); }
            else {
                document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
                sub.classList.add('open'); this.classList.add('open');
            }
        });
    });
    document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href && href === currentPage) item.classList.add('active');
    });
});
</script>

    <script>
    // ===== XSS 방지 헬퍼 =====
    if (typeof esc !== 'function') {
        window.esc = function(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        };
    }

    // ===== State =====
    let allStudents = [];
    let filteredStudents = [];
    let currentPage = 1;
    let totalPages = 1;
    const PER_PAGE = 20;

    // ===== Initialization =====
    document.addEventListener('DOMContentLoaded', async function() {
        requireAuth();
        renderSidebarUser();
        await loadStudents(1);
    });

    // ===== Load Withdrawn Students =====
    async function loadStudents(page) {
        currentPage = page || 1;

        try {
            let url = '/headquarters/withdrawn-students?page=' + currentPage + '&per_page=' + PER_PAGE;

            const res = await apiGet(url);
            allStudents = res.data || [];
            totalPages = res.total_pages || 1;
            filteredStudents = [...allStudents];
            renderStudents();
            renderPaginationUI();
            document.getElementById('studentCount').textContent = (res.total || 0) + '명';
        } catch (err) {
            console.error('Failed to load withdrawn students:', err);
            showAlert('탈퇴 학생 목록을 불러오는데 실패했습니다.', 'error');
        }
    }

    // ===== Render Students =====
    function renderStudents() {
        const tbody = document.getElementById('studentTableBody');

        if (filteredStudents.length === 0) {
            tbody.innerHTML = '<tr class="user-empty"><td colspan="8">👤 탈퇴한 학생 기록이 없습니다.</td></tr>';
            return;
        }

        let html = '';
        filteredStudents.forEach(s => {
            const name = s.student_name || s.name || '-';
            const username = s.username || '-';
            const email = s.email || '-';
            const courseName = s.course_name || s.course_title || '-';
            const branchName = s.branch_name || '-';
            const directorName = s.director_name || '-';
            const endDate = s.ended_at || s.withdrawn_at || s.end_date || '-';
            const reason = s.reason || s.withdrawal_reason || '-';

            // Format end date
            const formattedDate = endDate !== '-' ? endDate.split('T')[0] : '-';

            html += '<tr>';
            html += '<td><strong>' + esc(name) + '</strong></td>';
            html += '<td>' + esc(username) + '</td>';
            html += '<td style="font-size:12px">' + esc(email) + '</td>';
            html += '<td>' + esc(courseName) + '</td>';
            html += '<td>' + esc(branchName) + '</td>';
            html += '<td>' + esc(directorName) + '</td>';
            html += '<td style="font-size:12px;color:var(--text-tertiary)">' + formattedDate + '</td>';
            html += '<td style="font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(reason) + '">' + esc(reason) + '</td>';
            html += '</tr>';
        });
        tbody.innerHTML = html;
    }

    // ===== Filter (client-side search) =====
    function filterStudents() {
        const q = document.getElementById('searchInput').value.toLowerCase().trim();
        if (!q) {
            filteredStudents = [...allStudents];
        } else {
            filteredStudents = allStudents.filter(s =>
                (s.student_name && s.student_name.toLowerCase().includes(q)) ||
                (s.name && s.name.toLowerCase().includes(q)) ||
                (s.username && s.username.toLowerCase().includes(q)) ||
                (s.email && s.email.toLowerCase().includes(q)) ||
                (s.course_name && s.course_name.toLowerCase().includes(q)) ||
                (s.course_title && s.course_title.toLowerCase().includes(q)) ||
                (s.branch_name && s.branch_name.toLowerCase().includes(q)) ||
                (s.director_name && s.director_name.toLowerCase().includes(q)) ||
                (s.reason && s.reason.toLowerCase().includes(q)) ||
                (s.withdrawal_reason && s.withdrawal_reason.toLowerCase().includes(q))
            );
        }
        renderStudents();
    }

    // ===== Pagination =====
    function renderPaginationUI() {
        const wrap = document.getElementById('paginationWrap');
        let html = '';

        if (currentPage > 1) {
            html += '<button class="btn btn-ghost btn-sm" onclick="loadStudents(1)">«</button>';
            html += '<button class="btn btn-ghost btn-sm" onclick="loadStudents(' + (currentPage - 1) + ')">‹</button>';
        } else {
            html += '<button class="btn btn-ghost btn-sm" disabled>«</button><button class="btn btn-ghost btn-sm" disabled>‹</button>';
        }

        const start = Math.max(1, currentPage - 2);
        const end = Math.min(totalPages, currentPage + 2);
        for (let i = start; i <= end; i++) {
            html += '<button class="btn btn-sm ' + (i === currentPage ? 'btn-primary' : 'btn-ghost') + '" onclick="loadStudents(' + i + ')">' + i + '</button>';
        }

        if (currentPage < totalPages) {
            html += '<button class="btn btn-ghost btn-sm" onclick="loadStudents(' + (currentPage + 1) + ')">›</button>';
            html += '<button class="btn btn-ghost btn-sm" onclick="loadStudents(' + totalPages + ')">»</button>';
        } else {
            html += '<button class="btn btn-ghost btn-sm" disabled>›</button><button class="btn btn-ghost btn-sm" disabled>»</button>';
        }

        wrap.innerHTML = html;
    }
