<script>
document.addEventListener('DOMContentLoaded', function() {
    const currentPage = window.location.pathname.split('/').pop();
    const sectionMap = {
        'contracts.html': 'consult', 'portfolio-templates.html': 'report',
        'withdrawn-students.html': 'system', 'lecture-editor.html': 'eduops',
        'branches.html': 'consult', 'categories.html': 'eduops',
        'academy-management.html': 'consult', 'courses.html': 'eduops', 'users.html': 'consult',
        'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
        'director-reports.html': 'report', 'notices.html': 'system',
        'edu-materials.html': 'eduops', 'portfolio.html': 'report',
        'approvals.html': 'system', 'settings.html': 'system', 'site-manager.html': 'site', 'chat.html': 'system',
        'category-manager.html': 'system', 'category.html': 'system',
        'inquiries.html': 'eduops',
    };
    const currentSection = sectionMap[currentPage];
    if (currentSection) {
        const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
        if (toggle) { toggle.classList.add('open'); const sub = document.getElementById(`sub-${currentSection}`); if (sub) sub.classList.add('open'); }
    }
    document.querySelectorAll('.nav-toggle').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const section = this.dataset.section;
            const sub = document.getElementById(`sub-${section}`);
            if (!sub) return;
            const isOpen = sub.classList.contains('open');
            if (isOpen) { sub.classList.remove('open'); this.classList.remove('open'); }
            else {
                document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
                document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
                sub.classList.add('open'); this.classList.add('open');
            }
        });
    });
    document.querySelectorAll('.nav-item').forEach(item => {
        const href = item.getAttribute('href');
        if (href && href === currentPage) item.classList.add('active');
    });
});
</script>

   <script>
   let currentUser = null;
   let chatRooms = [];
   let currentRoomId = null;
   let currentWs = null;
   let msgOffset = 0;
   let isLoadingMessages = false;
   let hasMoreMessages = true;
   let selectedUsers = new Set();
   let availableUsers = [];
   let typingTimeout = null;
   let isTyping = false;

   document.addEventListener('DOMContentLoaded', async () => {
   try {
   requireAuth();
   renderSidebarUser();
   const now = new Date();
   document.getElementById('todayDate').textContent = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });

   // Get current user info from localStorage
   const stored = localStorage.getItem('user');
   if (stored) {
   currentUser = JSON.parse(stored);
   }

   await loadRooms();
   setupInfiniteScroll();
   } catch (e) {
   console.error('Init error:', e);
   }
  });

  function openNewChatModal() {
    document.getElementById('newChatOverlay').style.display = 'flex';
  }

  function closeModal(id) {
    const el = document.getElementById(id);
    if (el) {
      el.classList.remove('active');
      el.style.display = 'none';
    }
  }

  async function loadRooms() {
   try {
   const res = await apiGet('/chat/rooms');
   chatRooms = res?.data || [];
   renderRoomList();
   } catch (e) {
   console.error('Load rooms error:', e);
   }
   }

   function renderRoomList() {
   const container = document.getElementById('roomList');
   const searchVal = (document.getElementById('roomSearch').value || '').toLowerCase();

   let filtered = chatRooms;
   if (searchVal) {
   filtered = chatRooms.filter(r => r.name.toLowerCase().includes(searchVal));
   }

   if (!filtered.length) {
   container.innerHTML = '<div class="chat-empty" style="padding:40px 0"><p>채팅방이 없습니다.</p></div>';
   return;
   }

   container.innerHTML = filtered.map(r => {
   const isActive = r.id === currentRoomId;
   const time = r.last_message?.created_at ? formatChatTime(r.last_message.created_at) : '';
   const preview = r.last_message?.content || '';
   const badge = r.unread_count > 0 ? `<div class="cri-badge">${r.unread_count > 99 ? '99+' : r.unread_count}</div>` : '';
   return `<div class="chat-room-item ${isActive ? 'active' : ''}" onclick="selectRoom(${r.id})">
   <div class="cri-header">
   <div class="cri-name">${esc(r.name)}</div>
   <div class="cri-time">${time}</div>
   </div>
   <div class="cri-preview">${esc(preview)}</div>
   ${badge}
   </div>`;
   }).join('');
   }

   function selectRoom(roomId) {
   if (currentRoomId === roomId) return;

   // Disconnect old WS
   if (currentWs) {
   currentWs.close();
   currentWs = null;
   }

   currentRoomId = roomId;
   msgOffset = 0;
   hasMoreMessages = true;

   // Update UI
   renderRoomList();

   // Find room
   const room = chatRooms.find(r => r.id === roomId);
   document.getElementById('currentRoomName').textContent = room ? room.name : '채팅방';
   document.getElementById('currentRoomMeta').textContent = room ? `${room.room_type === 'direct' ? '1:1' : room.room_type === 'group' ? '그룹' : '공지'} · ${room.participant_count}명` : '';
   const participantsBtn = document.getElementById('participantsBtn');
   if (participantsBtn) participantsBtn.style.display = 'inline-flex';
   document.getElementById('participantCount').textContent = room?.participant_count || 0;

   // Show action buttons (모든 채팅방에서 표시)
   const db = document.getElementById('deleteBtn');
   const rb = document.getElementById('renameBtn');
   const pb = document.getElementById('participantsBtn');
   if (room) {
   if (db) db.style.display = 'inline-flex';
   if (rb) rb.style.display = 'inline-flex';
   if (pb) pb.style.display = 'inline-flex';
   } else {
   if (db) db.style.display = 'none';
   if (rb) rb.style.display = 'none';
   if (pb) pb.style.display = 'none';
   }

   // Clear messages
   document.getElementById('messageContainer').innerHTML = '';
   const emptyChat = document.getElementById('emptyChat');
   if (emptyChat) {
   emptyChat.style.display = 'block';
   const p = emptyChat.querySelector('p');
   if (p) p.textContent = '메시지를 불러오는 중...';
   }

   // Show chat main (mobile)
   document.getElementById('chatMain').classList.remove('hidden');
   document.getElementById('chatSidebar').classList.add('hidden');

   // Load messages
   loadMessages();

   // Connect WebSocket
   connectWebSocket(roomId);
   }

   function showRoomList() {
   document.getElementById('chatMain').classList.add('hidden');
   document.getElementById('chatSidebar').classList.remove('hidden');
   }

   async function loadMessages() {
   if (!currentRoomId || isLoadingMessages || !hasMoreMessages) return;
   isLoadingMessages = true;

   try {
   let url = `/chat/rooms/${currentRoomId}/messages?limit=50`;
   if (msgOffset > 0) url += `&before=${msgOffset}`;

   const res = await apiGet(url);
   const messages = res?.data || [];

   if (messages.length < 50) hasMoreMessages = false;
   const isInitialLoad = msgOffset === 0;
   if (messages.length > 0) {
   msgOffset = messages[0].id;
   }

   const container = document.getElementById('messageContainer');
   let emptyEl = document.getElementById('emptyChat');

   // emptyChat이 없으면 새로 생성 (selectRoom에서 innerHTML=''로 삭제된 경우)
   if (!emptyEl) {
   emptyEl = document.createElement('div');
   emptyEl.className = 'chat-empty';
   emptyEl.id = 'emptyChat';
   emptyEl.style.display = 'none';
   const iconDiv = document.createElement('div');
   iconDiv.className = 'icon';
   iconDiv.textContent = '💬';
   const p = document.createElement('p');
   p.textContent = '대화를 시작해보세요';
   emptyEl.appendChild(iconDiv);
   emptyEl.appendChild(p);
   container.prepend(emptyEl);
   }

   if (messages.length === 0 && msgOffset === 0) {
   emptyEl.style.display = 'flex';
   emptyEl.querySelector('p').textContent = '대화를 시작해보세요';
   return;
   }

   emptyEl.style.display = 'none';

   // Prepend messages (입장/퇴장 제외)
   const filteredMessages = messages.filter(m => !(m.message_type === 'system' && (m.content.includes('입장') || m.content.includes('퇴장'))));
   if (filteredMessages.length === 0) return;
   const fragment = document.createDocumentFragment();
   // We use temporary div to generate HTML and insert at top
   const tempDiv = document.createElement('div');
   tempDiv.innerHTML = filteredMessages.map(m => renderMessage(m, false)).join('');

   if (!isInitialLoad && filteredMessages.length > 0) {
   // Insert before first child
   while (tempDiv.firstChild) {
   container.insertBefore(tempDiv.firstChild, container.firstChild);
   }
   } else {
   container.innerHTML = filteredMessages.map(m => renderMessage(m, false)).join('');
   // Re-create emptyChat if it was destroyed by innerHTML
   if (!document.getElementById('emptyChat')) {
   const emptyEl = document.createElement('div');
   emptyEl.className = 'chat-empty';
   emptyEl.id = 'emptyChat';
   emptyEl.style.display = 'none';
   const iconDiv = document.createElement('div');
   iconDiv.className = 'icon';
   iconDiv.textContent = '💬';
   const p = document.createElement('p');
   p.textContent = '대화를 시작해보세요';
   emptyEl.appendChild(iconDiv);
   emptyEl.appendChild(p);
   container.appendChild(emptyEl);
   }
   }

   // Scroll to bottom on initial load
   if (isInitialLoad) {
   scrollToBottom();
   }

   // Auto mark as read
   if (messages.length > 0) {
   const maxId = Math.max(...messages.map(m => m.id));
   markRead(maxId);
   }
   } catch (e) {
   console.error('Load messages error:', e);
   } finally {
   isLoadingMessages = false;
   }
   }

   function renderMessage(m, withTime) {
   const isMine = m.sender_id === currentUser?.id;
   const isAdmin = currentUser?.role === 'super_admin' || currentUser?.role === 'admin';
   const isSystem = m.message_type === 'system';
   const isFile = m.message_type === 'file';
   const time = m.created_at ? formatChatTime(m.created_at) : '';

   if (isSystem) {
      return `<div class="chat-msg-wrap system"><div class="chat-msg-bubble">${esc(m.content)}</div></div>`;
   }

   const readMark = isMine ? '<span class="chat-msg-read">✓</span>' : '';
   let contentHtml = '';

   if (isFile) {
      const fileIcon = getFileIcon(m.file_name || '');
      const fileSize = m.file_size ? formatFileSize(m.file_size) : '';
      contentHtml = `<div class="chat-msg-file">
         <span class="file-icon">${fileIcon}</span>
         <div class="file-info">
            <div class="file-name">${esc(m.file_name || m.content || '파일')}</div>
            ${fileSize ? '<div class="file-size">' + fileSize + '</div>' : ''}
         </div>
         ${m.file_url ? '<a class="file-dl" href="' + m.file_url + '" target="_blank" rel="noopener">⬇ 다운로드</a>' : ''}
      </div>`;
   } else {
      contentHtml = esc(m.content);
   }

   const actions = (isMine || isAdmin) && !isFile
      ? `<span class="msg-actions">
         <span class="msg-action" onclick="event.stopPropagation();editMsg(${m.id},${m.sender_id})" title="수정">✏️</span>
         <span class="msg-action" onclick="event.stopPropagation();deleteMsg(${m.id},${m.sender_id})" title="삭제">🗑️</span>
      </span>`
      : '';

   return `<div class="chat-msg-wrap ${isMine ? 'mine' : ''}" data-msg-id="${m.id}">
      ${!isMine ? `<div class="chat-msg-sender">${esc(m.sender_name)}</div>` : ''}
      <div class="chat-msg-bubble">
         ${contentHtml}${actions}
         <div class="chat-msg-time">${time}${readMark}</div>
      </div>
   </div>`;
}

function getFileIcon(filename) {
   const ext = (filename || '').split('.').pop().toLowerCase();
   const icons = {
      'pdf': '📄', 'hwp': '📝', 'doc': '📝', 'docx': '📝',
      'xls': '📊', 'xlsx': '📊', 'csv': '📊',
      'ppt': '📽️', 'pptx': '📽️',
      'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
      'mp4': '🎬', 'avi': '🎬', 'mov': '🎬', 'webm': '🎬',
      'mp3': '🎵', 'wav': '🎵', 'ogg': '🎵',
      'zip': '📦', 'rar': '📦', 'gz': '📦', '7z': '📦',
      'ino': '🤖', 'py': '🐍', 'js': '📜', 'html': '🌐', 'css': '🎨',
   };
   return icons[ext] || '📄';
}

function formatFileSize(bytes) {
   if (!bytes) return '';
   if (bytes < 1024) return bytes + 'B';
   if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
   if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + 'MB';
   return (bytes / 1073741824).toFixed(1) + 'GB';
}

function connectWebSocket(roomId) {
   const token = localStorage.getItem('token') || localStorage.getItem('access_token');
   if (!token) {
      console.error('WebSocket: No auth token available');
      return;
   }

   const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
   const wsUrl = `${protocol}://${location.host}/api/v1/chat/ws/${roomId}?token=${encodeURIComponent(token)}`;

   currentWs = new WebSocket(wsUrl);

   currentWs.onopen = () => {
      console.log('WebSocket connected');
   };

   currentWs.onmessage = (event) => {
      try {
         const data = JSON.parse(event.data);
         handleWsMessage(data);
      } catch (e) {
         console.error('WS parse error:', e);
      }
   };

   currentWs.onclose = (e) => {
      console.log('WebSocket closed:', e.code, e.reason);
      if (!window._wsRetry) window._wsRetry = {};
      if (!window._wsRetry[roomId]) window._wsRetry[roomId] = 0;
      if (currentRoomId === roomId && window._wsRetry[roomId] < 3) {
         window._wsRetry[roomId]++;
         setTimeout(() => {
            if (currentRoomId === roomId) connectWebSocket(roomId);
         }, 5000);
      }
      setTimeout(() => { if (window._wsRetry) delete window._wsRetry[roomId]; }, 60000);
   };

   currentWs.onerror = () => {
      // onerror triggers onclose — let onclose handle reconnection
   };
}

function handleWsMessage(data) {
   const type = data.type;
   const payload = data.data;

   if (type === 'message') {
      appendMessage(payload);
      updateRoomLastMessage(payload);
      markRead(payload.id);
   } else if (type === 'system') {
      if (payload.content.includes('입장') || payload.content.includes('퇴장')) {
         return;
      }
      appendSystemMessage(payload.content);
   } else if (type === 'read_receipt') {
      updateReadMarks(payload.user_id, payload.last_read_id);
   } else if (type === 'typing') {
      showTyping(payload.user_name, payload.is_typing);
   } else if (type === 'edit') {
      const msgEl = document.querySelector(`[data-msg-id="${payload.id}"]`);
      if (msgEl) {
         const bubble = msgEl.querySelector('.chat-msg-bubble');
         if (bubble) {
            const timeEl = bubble.querySelector('.chat-msg-time');
            const actionsEl = bubble.querySelector('.msg-actions');
            bubble.innerHTML = esc(payload.content) + (actionsEl ? actionsEl.outerHTML : '') + (timeEl ? timeEl.outerHTML : '');
         }
      }
   } else if (type === 'delete') {
      const msgEl = document.querySelector(`[data-msg-id="${payload.id}"]`);
      if (msgEl) {
         msgEl.style.transition = 'opacity 0.3s';
         msgEl.style.opacity = '0';
         setTimeout(() => { if (msgEl.parentNode) msgEl.parentNode.removeChild(msgEl); }, 300);
      }
   }
}

function appendMessage(msg) {
   const container = document.getElementById('messageContainer');
   const emptyEl = document.getElementById('emptyChat');
   if (emptyEl) {
      emptyEl.style.display = 'none';
   }
   container.insertAdjacentHTML('beforeend', renderMessage(msg, true));
   scrollToBottom();
}

function appendSystemMessage(content) {
   const container = document.getElementById('messageContainer');
   container.insertAdjacentHTML('beforeend', `<div class="chat-msg-wrap system"><div class="chat-msg-bubble">${esc(content)}</div></div>`);
   scrollToBottom();
}

function scrollToBottom() {
   const container = document.getElementById('messageContainer');
   setTimeout(() => {
      container.scrollTop = container.scrollHeight;
   }, 50);
}

function setupInfiniteScroll() {
   const container = document.getElementById('messageContainer');
   container.addEventListener('scroll', () => {
      if (container.scrollTop < 50) {
         loadMessages();
      }
   });
}

function sendMessage() {
   const input = document.getElementById('msgInput');
   const text = input.value.trim();
   if (!text || !currentWs || currentWs.readyState !== WebSocket.OPEN) return;

   currentWs.send(JSON.stringify({
      type: 'message',
      data: { content: text, message_type: 'text' }
   }));

   input.value = '';
   document.getElementById('sendBtn').disabled = true;
   input.style.height = '44px';

   sendTyping(false);
}

async function editMsg(msgId, senderId) {
   const isMine = senderId === currentUser?.id;
   const isAdmin = currentUser?.role === 'super_admin' || currentUser?.role === 'admin';
   if (!isMine && !isAdmin) return;

   const msgEl = document.querySelector(`[data-msg-id="${msgId}"]`);
   if (!msgEl) return;
   const bubble = msgEl.querySelector('.chat-msg-bubble');
   if (!bubble) return;

   const currentText = bubble.childNodes[0]?.textContent?.trim() || '';
   const newText = prompt('메시지 수정:', currentText);
   if (!newText || newText === currentText) return;

   try {
      const res = await apiPut('/chat/messages/' + msgId, {content: newText});
      if (res?.status === 'success') {
         const actionsEl = bubble.querySelector('.msg-actions');
         const timeEl = bubble.querySelector('.chat-msg-time');
         bubble.innerHTML = esc(newText) + (actionsEl ? actionsEl.outerHTML : '') + (timeEl ? timeEl.outerHTML : '');
      } else {
         showAlert(res?.message || '수정 실패', 'error');
      }
   } catch (e) {
      showAlert('수정 오류: ' + (e.message || ''), 'error');
   }
}

async function deleteMsg(msgId, senderId) {
   const isMine = senderId === currentUser?.id;
   const isAdmin = currentUser?.role === 'super_admin' || currentUser?.role === 'admin';
   if (!isMine && !isAdmin) return;

   if (!confirm('이 메시지를 삭제하시겠습니까?')) return;

   try {
      const res = await api('DELETE', '/chat/messages/' + msgId);
      if (res?.status === 'success') {
         const msgEl = document.querySelector(`[data-msg-id="${msgId}"]`);
         if (msgEl) {
            msgEl.style.transition = 'opacity 0.3s';
            msgEl.style.opacity = '0';
            setTimeout(() => { if (msgEl.parentNode) msgEl.parentNode.removeChild(msgEl); }, 300);
         }
      } else {
         showAlert(res?.message || '삭제 실패', 'error');
      }
   } catch (e) {
      showAlert('삭제 오류: ' + (e.message || ''), 'error');
   }
}

function onInputChange() {
   const input = document.getElementById('msgInput');
   const hasText = input.value.trim().length > 0;
   document.getElementById('sendBtn').disabled = !hasText || !currentWs;

   input.style.height = '44px';
   input.style.height = Math.min(input.scrollHeight, 120) + 'px';

   if (hasText && !isTyping) {
      sendTyping(true);
      isTyping = true;
   }

   clearTimeout(typingTimeout);
   typingTimeout = setTimeout(() => {
      if (isTyping) {
         sendTyping(false);
         isTyping = false;
      }
   }, 2000);
}

function onInputKeydown(e) {
   if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
   }
}

function sendTyping(isTyping) {
   if (currentWs && currentWs.readyState === WebSocket.OPEN) {
      currentWs.send(JSON.stringify({
         type: 'typing',
         data: { is_typing: isTyping }
      }));
   }
}

function markRead(messageId) {
   if (!currentRoomId || !messageId) return;
   apiPut(`/chat/rooms/${currentRoomId}/read`, { message_id: messageId }).catch(() => {});
}

function updateReadMarks(userId, lastReadId) {
   renderRoomList();
}

function updateRoomLastMessage(msg) {
   const room = chatRooms.find(r => r.id === currentRoomId);
   if (room) {
      room.last_message = {
         content: msg.content,
         sender_name: msg.sender_name,
         created_at: msg.created_at
      };
   }
}

function showTyping(userName, isTyping) {
   const el = document.getElementById('typingIndicator');
   if (isTyping) {
      el.textContent = `${esc(userName)}님이 입력 중...`;
      el.style.display = 'block';
   } else {
      el.style.display = 'none';
   }
}

function filterRooms() {
   renderRoomList();
}

// ============================================================
// New Chat Modal
// ============================================================

async function openNewChatModal() {
   selectedUsers.clear();
   document.getElementById('selectedUserTags').innerHTML = '';
   document.getElementById('userSearch').value = '';
   document.getElementById('chatTypeSelect').value = 'direct';
   const gnf = document.getElementById('groupNameField');
   if (gnf) gnf.style.display = 'none';
   document.getElementById('groupNameInput').value = '';
   document.getElementById('newChatOverlay').style.display = 'flex';

   try {
      const res = await apiGet('/chat/users-available');
      availableUsers = res?.data || [];
      renderAvailableUsers();
   } catch (e) {
      availableUsers = [];
   }
}

function onChatTypeChange() {
   const type = document.getElementById('chatTypeSelect').value;
   const gnf = document.getElementById('groupNameField');
   if (gnf) gnf.style.display = type === 'group' ? 'block' : 'none';
}

function renderAvailableUsers() {
   const searchVal = (document.getElementById('userSearch').value || '').toLowerCase();
   let filtered = availableUsers.filter(u => !selectedUsers.has(u.id));
   if (searchVal) {
      filtered = filtered.filter(u => u.name.toLowerCase().includes(searchVal) || u.role.toLowerCase().includes(searchVal));
   }

   const container = document.getElementById('availableUserList');
   if (!filtered.length) {
      container.innerHTML = '<div class="user-select-item" style="color:var(--text-tertiary);cursor:default">검색 결과가 없습니다.</div>';
      return;
   }

   container.innerHTML = filtered.map(u => {
      const roleLabel = {super_admin:'본사', admin:'본사', branch_admin:'에듀케어', branch_manager:'에듀케어', director:'원장', student:'학생', parent:'학부모'}[u.role] || u.role;
      const _aff = (u.region || u.branch_name || '') && ['director','branch_admin','branch_manager','branch_staff'].indexOf(u.role) !== -1 ? (u.region || u.branch_name) : '';
      const affil = _aff
         ? ' <span style="font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:#F3E5F5;color:#6A1B9A;margin-left:2px;white-space:nowrap">[' + esc(_aff) + ']</span>' : '';
      return `<div class="user-select-item" onclick="toggleUserSelect(${u.id}, '${esc(u.name)}', '${esc(roleLabel)}')">
         <div class="check"></div>
         <span><strong>${esc(u.name)}</strong>${affil} <span style="font-size:11px;color:var(--text-tertiary)">(${roleLabel})</span></span>
      </div>`;
   }).join('');
}

function filterAvailableUsers() {
   renderAvailableUsers();
}

function toggleUserSelect(id, name, role) {
   if (selectedUsers.has(id)) {
      selectedUsers.delete(id);
   } else {
      selectedUsers.add(id);
   }
   renderAvailableUsers();
   renderSelectedTags();
}

function renderSelectedTags() {
   const container = document.getElementById('selectedUserTags');
   if (selectedUsers.size === 0) {
      container.innerHTML = '';
      return;
   }

   container.innerHTML = Array.from(selectedUsers).map(id => {
      const u = availableUsers.find(u => u.id === id);
      return `<span class="selected-tag">${esc(u ? u.name : '?')} <span class="remove" onclick="toggleUserSelect(${id})">×</span></span>`;
   }).join('');
}

async function createChatRoom() {
   const type = document.getElementById('chatTypeSelect').value;

   if (type === 'direct') {
      if (selectedUsers.size !== 1) {
         showAlert('1:1 채팅은 한 명만 선택해주세요.', 'error');
         return;
      }
      const targetId = Array.from(selectedUsers)[0];
      try {
         const res = await apiPost('/chat/rooms', {
            room_type: 'direct',
            user_id: targetId
         });
         if (res?.status === 'success') {
            closeModal('newChatOverlay');
            await loadRooms();
            selectRoom(res.data.id);
         }
      } catch (e) {
         showAlert('채팅방 생성 실패: ' + (e.message || ''), 'error');
      }
   } else {
      const name = document.getElementById('groupNameInput').value.trim();
      if (!name) {
         showAlert('그룹방 이름을 입력해주세요.', 'error');
         return;
      }
      if (selectedUsers.size < 2) {
         showAlert('그룹 채팅은 최소 2명 이상 선택해주세요.', 'error');
         return;
      }
      try {
         const res = await apiPost('/chat/rooms', {
            room_type: 'group',
            name: name,
            user_ids: Array.from(selectedUsers)
         });
         if (res?.status === 'success') {
            closeModal('newChatOverlay');
            await loadRooms();
            selectRoom(res.data.id);
         }
      } catch (e) {
         showAlert('채팅방 생성 실패: ' + (e.message || ''), 'error');
      }
   }
}

// ============================================================
// Participants Modal
// ============================================================

async function toggleParticipants() {
   if (!currentRoomId) return;
   openModal('participantsModal');
   document.getElementById('participantsBody').innerHTML = '<div class="chat-empty"><p>로딩 중...</p></div>';

   try {
      const res = await apiGet(`/chat/rooms/${currentRoomId}/participants`);
      const participants = res?.data || [];
      document.getElementById('participantsBody').innerHTML = participants.map(p =>
         `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--chat-border)">
            <div><strong>${esc(p.name)}</strong> <span style="font-size:11px;color:var(--text-tertiary)">(${p.role})</span></div>
            <span style="font-size:11px;color:var(--text-tertiary)">${p.participant_role === 'admin' ? '방장' : '멤버'}</span>
         </div>`
      ).join('');
   } catch (e) {
      document.getElementById('participantsBody').innerHTML = '<div class="chat-empty"><p>불러오기 실패</p></div>';
   }
}

// ============================================================
// Utils
// ============================================================

function formatChatTime(dateStr) {
   if (!dateStr) return '';
   const d = new Date(dateStr);
   const now = new Date();
   const diffDays = Math.floor((now - d) / (1000 * 60 * 60 * 24));

   if (diffDays === 0) {
      return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
   } else if (diffDays === 1) {
      return '어제';
   } else if (diffDays < 7) {
      return `${diffDays}일 전`;
   } else {
      return `${d.getMonth() + 1}/${d.getDate()}`;
   }
}

// ============================================================
// Room Management
// ============================================================

async function deleteRoom() {
   if (!currentRoomId) return;
   const room = chatRooms.find(r => r.id === currentRoomId);
   if (!room) return;

   const isCreator = room.created_by === currentUser?.id;
   const isAdmin = currentUser?.role === 'super_admin' || currentUser?.role === 'admin';

   if (isCreator || isAdmin) {
      if (!confirm('정말 이 채팅방을 삭제하시겠습니까? 모든 메시지가 사라집니다.')) return;
   } else {
      if (!confirm('이 채팅방을 나가시겠습니까?')) return;
   }

   try {
      let res;
      if (isCreator || isAdmin) {
         res = await api('DELETE', '/chat/rooms/' + currentRoomId);
      } else {
         res = await api('POST', '/chat/rooms/' + currentRoomId + '/leave');
      }
      if (res && res.status === 'success') {
         showAlert(isCreator || isAdmin ? '채팅방이 삭제되었습니다.' : '방을 나갔습니다.', 'success');
         if (currentWs) { currentWs.close(); currentWs = null; }
         currentRoomId = null;
         await loadRooms();
         const cm = document.getElementById('chatMain');
         const cs = document.getElementById('chatSidebar');
         if (cm) cm.classList.add('hidden');
         if (cs) cs.classList.remove('hidden');
      } else {
         showAlert(res?.message || '실패', 'error');
      }
   } catch (e) {
      showAlert('오류: ' + (e.message || ''), 'error');
   }
}

async function renameRoom() {
   if (!currentRoomId) return;
   const room = chatRooms.find(r => r.id === currentRoomId);
   if (!room) return;
   const newName = prompt('새 채팅방 이름을 입력하세요:', room.name);
   if (!newName || newName === room.name) return;
   try {
      const res = await apiPut('/chat/rooms/' + currentRoomId, {name: newName});
      if (res && res.status === 'success') {
         showAlert('채팅방 이름이 변경되었습니다.', 'success');
         room.name = newName;
         const crn = document.getElementById('currentRoomName');
         if (crn) crn.textContent = newName;
         renderRoomList();
      } else {
         showAlert(res?.message || '이름 변경 실패', 'error');
      }
   } catch (e) {
      showAlert('이름 변경 중 오류: ' + (e.message || ''), 'error');
   }
}

function esc(s) {
   if (s == null) return '';
   const d = document.createElement('div');
   d.textContent = s;
   return d.innerHTML;
}

// ============================================================
// File Upload
// ============================================================
let pendingFile = null;

function onFileSelected(event) {
   const file = event.target.files[0];
   if (!file) return;

   if (file.size > 10 * 1024 * 1024) {
      showAlert('파일 크기는 10MB 이하여야 합니다.', 'error');
      return;
   }

   pendingFile = file;
   document.getElementById('fpName').textContent = file.name + ' (' + formatFileSize(file.size) + ')';
   document.getElementById('filePreview').classList.add('show');

   uploadFile();
}

function cancelFileUpload() {
   pendingFile = null;
   document.getElementById('filePreview').classList.remove('show');
   document.getElementById('fileInput').value = '';
}

async function uploadFile() {
   if (!pendingFile || !currentRoomId) return;

   const file = pendingFile;
   const formData = new FormData();
   formData.append('file', file);

   const token = localStorage.getItem('token') || localStorage.getItem('access_token');

   document.getElementById('fpName').textContent = '⏳ 업로드 중... ' + file.name;

   try {
      const res = await fetch('/api/v1/chat/rooms/' + currentRoomId + '/upload', {
         method: 'POST',
         headers: token ? { 'Authorization': 'Bearer ' + token } : {},
         body: formData,
      });
      const json = await res.json();

      if (!res.ok) throw new Error(json.detail || '업로드 실패');

      if (currentWs && currentWs.readyState === WebSocket.OPEN) {
         currentWs.send(JSON.stringify({
            type: 'message',
            data: {
               content: json.data.file_name,
               message_type: 'file',
               file_url: json.data.file_url,
               file_name: json.data.file_name,
               file_size: json.data.file_size,
            }
         }));
      }

      cancelFileUpload();
   } catch (e) {
      document.getElementById('fpName').textContent = '❌ 업로드 실패: ' + (e.message || '');
      setTimeout(cancelFileUpload, 3000);
   }
}
</script>
