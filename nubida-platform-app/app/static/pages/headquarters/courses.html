   <script>
   document.addEventListener('DOMContentLoaded', function() {
   const currentPage = window.location.pathname.split('/').pop();

   // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <script>
   function esc(s) { if (typeof s !== 'string') s = String(s || ''); return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  document.addEventListener('DOMContentLoaded', function() {
  requireAuth();
  renderSidebarUser();
  loadNav();
  onAuthReady(loadCategories);
  });

   function loadNav() {
   const container = document.getElementById('navContainer');
   if (!container) return;
   fetch('/pages/headquarters/nav.html')
   .then(r => r.text())
   .then(html => {
   container.innerHTML = html;
   // Mark current page active
   const currentPage = 'courses.html';
   container.querySelectorAll('.nav-item').forEach(function(a) {
   if (a.getAttribute('href') === currentPage) a.classList.add('active');
   });
   })
   .catch(function() { container.innerHTML = '네비게이션 로딩 실패'; });
   }

   async function loadCategories() {
   var overlay = document.getElementById('pageLoading');
   if (overlay) overlay.classList.remove('hide');
   try {
   const res = await apiGet('/headquarters/courses/categories');
   const cats = res.data || [];
   const grid = document.getElementById('categoryGrid');
   if (overlay) overlay.classList.add('hide');
   if (cats.length === 0) {
   grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-tertiary)">📭 등록된 카테고리가 없습니다. 아래 [+추가] 버튼으로 생성해주세요.</div>';
   return;
   }
   let html = '';
   cats.forEach(function(c) {
   const color = c.color || '#4F5EF8';
   const bgColor = c.bg_color || 'rgba(8,145,178,0.08)';
   const iconMap = {
   'ai_art': '🎨', 'ai_robot': '🤖'
   };
   const icon = iconMap[c.key] || '📁';
   html += '<div class="cat-card" style="border-top:3px solid ' + color + '">';
   html += '<div class="cat-icon">' + icon + '</div>';
   html += '<div class="cat-name" style="color:' + color + '">' + esc(c.name) + '</div>';
   html += '<div class="cat-stats">';
   html += '<span>📖 강좌 ' + (c.course_count || 0) + '개</span>';
   html += '<span>📁 폴더 ' + (c.folder_count || 0) + '개</span>';
   html += '</div>';
   html += '<a href="category.html?cat=' + encodeURIComponent(c.key) + '" class="cat-btn" style="background:' + color + '">바로가기 →</a>';
   html += '</div>';
   });
   // Add card
   html += '<div class="cat-add-card" onclick="openCreateCategoryModal()">';
   html += '<div class="plus">+</div>';
   html += '<div class="label">카테고리 추가</div>';
   html += '</div>';
   grid.innerHTML = html;
   } catch (err) {
   if (overlay) overlay.classList.add('hide');
   document.getElementById('categoryGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-tertiary)">❌ 카테고리 로딩 실패: ' + esc(err.message) + '</div>';
   }
   }

   // ===== Create Category Modal (inline) =====
   function openCreateCategoryModal() {
   const name = prompt('새 카테고리 이름을 입력하세요.\n예: 스마트팜, 창의융합', '');
   if (!name) return;
   const key = prompt('카테고리 키(영문/언더스코어)를 입력하세요.\n예: smart_farm, creative_merge', name.toLowerCase().replace(/[^a-z0-9_]/g, '_'));
   if (!key) return;
   const color = prompt('글자색 (hex code, 예: #6B21A8)', '#6B21A8');
   const bgColor = prompt('배경색 (hex code, 예: #F3E8FF)', '#F3E8FF');
   apiPost('/headquarters/categories', {
   key: key,
   name: name,
   color: color || null,
   bg_color: bgColor || null,
   sort_order: 99
   }).then(function(res) {
   showAlert('카테고리가 생성되었습니다.', 'success');
   loadCategories();
   }).catch(function(err) {
   showAlert(err.message || '생성 실패', 'error');
   });
   }
   </script>
