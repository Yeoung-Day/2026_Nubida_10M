    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
   // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <script>
   document.addEventListener('DOMContentLoaded', async () => {
   requireAuth();
   const user = getCurrentUser();
   if (user) {
   document.getElementById('sidebarUserName').textContent = user.name || '관리자';
   document.getElementById('sidebarUserRole').textContent = '본사';
   }
   const now = new Date();
   document.getElementById('todayDate').textContent = now.toLocaleDateString('ko-KR', {
   year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
   });

   await loadSessions();
   await loadBranchOptions();

   // 검색 디바운스
   let searchTimer;
   document.getElementById('classSearch').addEventListener('input', () => {
   clearTimeout(searchTimer);
   searchTimer = setTimeout(loadSessions, 300);
   });
   });

   async function loadBranchOptions() {
   try {
   const res = await apiGet('/headquarters/branches?per_page=100');
   const items = res.data?.items || res.data || [];
   const sel = document.getElementById('sessionBranch');
   sel.innerHTML = '<option value="">지사 선택</option>' +
   items.map(b => `<option value="${b.id}">${escHtml(b.name)}</option>`).join('');
   } catch(e) {}
   }

   async function loadSessions() {
   const tbody = document.getElementById('sessionBody');
   try {
   const search = document.getElementById('classSearch').value.trim();
   let url = '/classroom/sessions?per_page=50';
   if (search) url += '&q=' + encodeURIComponent(search);
   const res = await apiGet(url);
   const items = res.data?.items || res.data || [];
   if (!items.length) {
   tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-tertiary);padding:24px">등록된 수업 세션이 없습니다</td></tr>';
   } else {
   tbody.innerHTML = items.map(s => {
   const status = s.status === 'active' ? '🟢 진행' : s.status === 'completed' ? '✅ 완료' : '🔴 취소';
   const date = s.date ? new Date(s.date).toLocaleDateString('ko-KR') : '-';
   return `<tr>
   <td><strong>${escHtml(s.title || s.name || '-')}</strong></td>
   <td>${escHtml(s.instructor || '-')}</td>
   <td>${escHtml(s.branch_name || '-')}</td>
   <td>${date}</td>
   <td>${escHtml(s.time || '-')}</td>
   <td>${status}</td>
   <td>
   <button class="btn btn-sm btn-outline" onclick="deleteSession(${s.id})">삭제</button>
   </td>
   </tr>`;
   }).join('');
   }
   } catch(e) {
   tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--danger);padding:24px">⚠️ 데이터 로딩 실패</td></tr>';
   }
   }

   function openCreateModal() {
   document.getElementById('createModal').style.display = 'flex';
   document.getElementById('sessionTitle').value = '';
   document.getElementById('sessionInstructor').value = '';
   document.getElementById('sessionDate').value = new Date().toISOString().slice(0,10);
   document.getElementById('sessionTime').value = '09:00';
   }

   function closeCreateModal() {
   document.getElementById('createModal').style.display = 'none';
   }

   async function createSession() {
   const title = document.getElementById('sessionTitle').value.trim();
   const branch_id = document.getElementById('sessionBranch').value;
   const instructor = document.getElementById('sessionInstructor').value.trim();
   const date = document.getElementById('sessionDate').value;
   const time = document.getElementById('sessionTime').value;
   if (!title || !branch_id) { alert('강의명과 지사를 입력해주세요.'); return; }
   try {
   await apiPost('/classroom/sessions', { title, branch_id, instructor, date, time });
   closeCreateModal();
   await loadSessions();
   } catch(e) {
   alert('세션 생성 실패: ' + (e.message || '오류'));
   }
   }

   async function deleteSession(id) {
   if (!confirm('정말 삭제하시겠습니까?')) return;
   try {
   await apiDelete('/classroom/sessions/' + id);
   await loadSessions();
   } catch(e) {
   alert('삭제 실패');
   }
   }

   function escHtml(s) {
   const d = document.createElement('div');
   d.textContent = s;
   return d.innerHTML;
   }
   </script>
