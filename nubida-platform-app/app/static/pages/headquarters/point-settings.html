    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
        // 섹션 매핑
        const sectionMap = {
            'branches.html': 'operations', 'academy-management.html': 'operations', 
            'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <div class="modal-overlay" id="createModal">

   <div class="modal-body">
   <div class="form-group">
   <label>대상 유형</label>
   <select class="input" id="editTargetType">
   <option value="course">교육 과정</option>
   <option value="portfolio">포트폴리오</option>
   </select>
   </div>
   <div class="form-group">
   <label>대상 ID (비우면 전체 기본값)</label>
   <input type="number" class="input" id="editTargetId" placeholder="과정/포트폴리오 ID">
   </div>
   <div class="form-group">
   <label>지급 포인트</label>
   <input type="number" class="input" id="editPoints" placeholder="예: 500" required>
   </div>
   </div>
   <div class="modal-footer">
   <button class="btn btn-primary" onclick="saveSetting()">저장</button>
   <button class="btn btn-secondary" onclick="closeModal()">취소</button>
   </div>

   <script src="/common/js/api.js?v=20260610a"></script>
   <script src="/common/js/auth.js?v=20260610a"></script>
   <script src="/common/js/hamburger.js?v=20260610a"></script>
   <script src="/common/js/nav.js?v=20260610a"></script>
   <script>
   let editingId = null;

   document.addEventListener('DOMContentLoaded', function() {
   requireAuth();
   renderSidebarUser();
   const u = JSON.parse(localStorage.getItem('user') || '{}');
   if (u.name) document.getElementById('sidebarUserName').textContent = u.name;
   document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
   loadSettings();
   });

   async function loadSettings() {
   const type = document.getElementById('filterType').value;
   const res = await apiGet('/headquarters/point-settings' + (type ? '?target_type='+type : ''));
   const data = res.data || [];
   document.getElementById('settingsTable').innerHTML = data.map(s => `
   <tr>
   <td><span class="badge badge-${s.target_type === 'course' ? 'primary' : 'warning'}">${s.target_type === 'course' ? '교육' : '포트폴리오'}</span></td>
   <td>${s.target_id || '<span style="color:#9CA3AF">전체 기본</span>'}</td>
   <td><strong>${s.points.toLocaleString()}p</strong></td>
   <td><span class="badge badge-success">${s.is_active ? '활성' : '비활성'}</span></td>
   <td style="font-size:12px;color:#9CA3AF">${s.created_at || ''}</td>
   <td>
   <button class="btn btn-sm btn-primary" onclick="editSetting(${s.id},'${s.target_type}',${s.target_id || 'null'},${s.points})">수정</button>
   <button class="btn btn-sm btn-danger" onclick="deleteSetting(${s.id})">삭제</button>
   </td>
   </tr>
   `).join('');
   }

   function openCreateModal() {
   editingId = null;
   document.getElementById('modalTitle').textContent = '포인트 설정 추가';
   document.getElementById('editTargetType').value = 'course';
   document.getElementById('editTargetId').value = '';
   document.getElementById('editPoints').value = '';
   document.getElementById('createModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }

   function editSetting(id, type, targetId, points) {
   editingId = id;
   document.getElementById('modalTitle').textContent = '포인트 설정 수정';
   document.getElementById('editTargetType').value = type;
   document.getElementById('editTargetId').value = targetId || '';
   document.getElementById('editPoints').value = points;
   document.getElementById('createModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }

   function closeModal() {
   document.getElementById('createModal').classList.remove('active');
   document.getElementById('sidebarOverlay').classList.remove('active');
   }

   async function saveSetting() {
   const type = document.getElementById('editTargetType').value;
   const tid = document.getElementById('editTargetId').value;
   const points = parseInt(document.getElementById('editPoints').value);
   if (!points || points < 0) { alert('포인트를 입력해주세요.'); return; }
   try {
   if (editingId) {
   await apiPut('/headquarters/point-settings/' + editingId, { points });
   } else {
   await apiPost('/headquarters/point-settings', { target_type: type, target_id: tid ? parseInt(tid) : null, points });
   }
   closeModal(); loadSettings();
   } catch(e) { alert(e.message || '오류'); }
   }

   async function deleteSetting(id) {
   if (!confirm('삭제하시겠습니까?')) return;
   try { await apiDelete('/headquarters/point-settings/' + id); loadSettings(); }
   catch(e) { alert(e.message); }
   }
   </script>
