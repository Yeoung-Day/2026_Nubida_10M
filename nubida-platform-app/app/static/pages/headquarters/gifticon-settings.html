    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
        // 섹션 매핑
        const sectionMap = {
            'branches.html': 'operations', 'academy-management.html': 'operations', 
            'courses.html': 'operations', 'users.html': 'operations',
            'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
            'point-management.html': 'point', 'point-settings.html': 'point', 
            'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
            'director-reports.html': 'report', 'notices.html': 'report', 
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <div class="form-group">

   <option value="치킨">치킨</option>
   <option value="커피">커피</option>

   </select>
   </div>
   <div class="form-group">
   <label>금액 (원)</label>
   <input type="number" class="input" id="editValue" placeholder="예: 20000">
   </div>
   <div class="form-group">
   <label>필요 포인트</label>
   <input type="number" class="input" id="editPoints" placeholder="예: 2000">
   </div>
   <div class="form-group">
   <label>정렬 순서</label>
   <input type="number" class="input" id="editOrder" placeholder="1" value="0">
   </div>
   </div>
   <div class="modal-footer">
   <button class="btn btn-primary" onclick="saveItem()">저장</button>
   <button class="btn btn-secondary" onclick="closeModal()">취소</button>
   </div>

   <script src="/common/js/api.js?v=20260610a"></script>
   <script src="/common/js/auth.js?v=20260610a"></script>
   <script src="/common/js/hamburger.js?v=20260610a"></script>
   <script src="/common/js/nav.js?v=20260610a"></script>
   <script>
   let editingId = null;

   document.addEventListener('DOMContentLoaded', function() {
   const u = JSON.parse(localStorage.getItem('user') || '{}');
   if (u.name) document.getElementById('sidebarUserName').textContent = u.name;
   document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
   loadItems();
   });

   async function loadItems() {
   const res = await apiGet('/headquarters/gifticon-settings');
   const data = res.data || [];
   document.getElementById('settingsTable').innerHTML = data.map(g => `
   <tr>
   <td><strong>${g.name}</strong></td>
   <td>${g.gifticon_type}</td>
   <td>${g.value.toLocaleString()}원</td>
   <td><span style="color:#4F5EF8;font-weight:700">${g.points_required.toLocaleString()}p</span></td>
   <td>${g.sort_order}</td>
   <td><span class="badge badge-success">● 활성</span></td>
   <td>
   <button class="btn btn-sm btn-primary" onclick="editItem(${g.id},'${g.name}','${g.gifticon_type}',${g.value},${g.points_required},${g.sort_order})">수정</button>
   <button class="btn btn-sm btn-danger" onclick="deleteItem(${g.id})">삭제</button>
   </td>
   </tr>
   `).join('');
   }

   function openCreateModal() {
   editingId = null;
   document.getElementById('modalTitle').textContent = '기프티콘 추가';
   ['editName','editValue','editPoints','editOrder'].forEach(id => document.getElementById(id).value = '');
   document.getElementById('editType').value = '문화상품권';
   document.getElementById('createModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }

   function editItem(id, name, type, value, points, order) {
   editingId = id;
   document.getElementById('modalTitle').textContent = '기프티콘 수정';
   document.getElementById('editName').value = name;
   document.getElementById('editType').value = type;
   document.getElementById('editValue').value = value;
   document.getElementById('editPoints').value = points;
   document.getElementById('editOrder').value = order;
   document.getElementById('createModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }

   function closeModal() {
   document.getElementById('createModal').classList.remove('active');
   document.getElementById('sidebarOverlay').classList.remove('active');
   }

   async function saveItem() {
   const payload = {
   name: document.getElementById('editName').value,
   gifticon_type: document.getElementById('editType').value,
   value: parseInt(document.getElementById('editValue').value) || 0,
   points_required: parseInt(document.getElementById('editPoints').value) || 0,
   sort_order: parseInt(document.getElementById('editOrder').value) || 0,
   };
   if (!payload.name) { alert('상품명을 입력해주세요.'); return; }
   try {
   if (editingId) { await apiPut('/headquarters/gifticon-settings/' + editingId, payload); }
   else { await apiPost('/headquarters/gifticon-settings', payload); }
   closeModal(); loadItems();
   } catch(e) { alert(e.message || '오류'); }
   }

   async function deleteItem(id) {
   if (!confirm('삭제하시겠습니까?')) return;
   try { await apiDelete('/headquarters/gifticon-settings/' + id); loadItems(); }
   catch(e) { alert(e.message); }
   }
   </script>
