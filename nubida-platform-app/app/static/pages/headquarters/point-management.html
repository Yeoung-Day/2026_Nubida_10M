   <script>
   document.addEventListener('DOMContentLoaded', function() {
   const currentPage = window.location.pathname.split('/').pop();

   // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <script>
   let currentPage = 1;
   const PER_PAGE = 20;
   let allTxns = [];

   // ===== 사이드바 사용자명 =====
   document.addEventListener('DOMContentLoaded', function() {
   requireAuth();
   renderSidebarUser();
   const u = JSON.parse(localStorage.getItem('user') || '{}');
   if (u.name) document.getElementById('sidebarUserName').textContent = u.name;
   document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
   loadStats();
   loadTxns(1);
   loadStudents();
   });

   function switchTab(name) {
   document.querySelectorAll('.tab-panel').forEach(t => t.classList.remove('active'));
   document.querySelectorAll('.tab-header button').forEach(b => b.classList.remove('active'));
   document.getElementById('tab-' + name).classList.add('active');
   event.target.classList.add('active');
   }

   async function loadStats() {
   try {
   const [txnRes, reqRes] = await Promise.all([
   apiGet('/headquarters/point-transactions?per_page=10000').catch(() => ({data:[]})),
   apiGet('/headquarters/gifticon-requests?status=pending').catch(() => ({data:[]}))
   ]);
   const txns = txnRes.data || [];
   document.getElementById('statStudents').textContent = new Set(txns.map(t => t.user_id)).size;
   document.getElementById('statTotalEarned').textContent = txns.filter(t => t.points > 0).reduce((a,t) => a + t.points, 0).toLocaleString();
   document.getElementById('statTotalUsed').textContent = Math.abs(txns.filter(t => t.points < 0).reduce((a,t) => a + t.points, 0)).toLocaleString();
   document.getElementById('statPending').textContent = (reqRes.data || []).length;
   } catch(e) {}
   }

   async function loadTxns(page) {
   currentPage = page || 1;
   try {
   const res = await apiGet(`/headquarters/point-transactions?per_page=${PER_PAGE}&page=${currentPage}`);
   allTxns = res.data || [];
   renderTxnTable(allTxns);
   const total = res.total || 0;
   const totalPages = Math.ceil(total / PER_PAGE) || 1;
   const el = document.getElementById('txnPagination');
   if (totalPages <= 1) { el.innerHTML = ''; return; }
   let html = `<button ${currentPage <= 1 ? 'disabled' : ''} onclick="loadTxns(${currentPage-1})">‹</button>`;
   for (let i = 1; i <= totalPages; i++) {
   if (Math.abs(i - currentPage) <= 2 || i === 1 || i === totalPages) {
   html += `<button class="${i === currentPage ? 'active' : ''}" onclick="loadTxns(${i})">${i}</button>`;
   } else if (i === currentPage - 3 || i === currentPage + 3) {
   html += `<button disabled>…</button>`;
   }
   }
   html += `<button ${currentPage >= totalPages ? 'disabled' : ''} onclick="loadTxns(${currentPage+1})">›</button>`;
   el.innerHTML = html;
   } catch(e) {
   document.getElementById('txnTable').innerHTML = '<tr><td colspan="5" class="empty">오류가 발생했습니다.</td></tr>';
   }
   }

   function renderTxnTable(txns) {
   const tbody = document.getElementById('txnTable');
   if (!txns.length) {
   tbody.innerHTML = '<tr><td colspan="5" class="empty text-center p-24">거래 내역이 없습니다.</td></tr>';
   return;
   }
   const typeLabel = { course_complete:'🎓 교육 완료', portfolio_approve:'📁 포트폴리오 승인', gifticon_exchange:'🎁 기프티콘 교환', admin_adjust:'⚡ 관리자 조정' };
   tbody.innerHTML = txns.map(t => {
   const cls = t.points > 0 ? 'txn-plus' : 'txn-minus';
   const sign = t.points > 0 ? '+' : '';
   return `<tr>
   <td style="font-size:12px;color:#9CA3AF;white-space:nowrap">${t.created_at || ''}</td>
   <td><span class="student-select" onclick="filterByUser(${t.user_id})">${t.user_name || 'ID:'+t.user_id}</span></td>
   <td><span class="badge badge-${t.points > 0 ? 'success' : 'danger'}">${typeLabel[t.transaction_type] || t.transaction_type}</span></td>
   <td class="${cls}">${sign}${t.points.toLocaleString()}P</td>
   <td style="font-size:13px;color:#6B7280">${t.description || ''}</td>
   </tr>`;
   }).join('');
   }

   function searchTxns() { loadTxns(1); }

   function filterByUser(userId) {
   switchTab('students');
   document.getElementById('searchStudentName').value = String(userId);
   searchStudents();
   }

   let allStudentData = [];

   async function loadStudents() {
   try {
   const res = await apiGet('/headquarters/point-transactions?per_page=10000');
   const txns = res.data || [];
   const map = {};
   txns.forEach(t => {
   if (!map[t.user_id]) map[t.user_id] = { user_id: t.user_id, user_name: t.user_name || 'ID:'+t.user_id, earned: 0, used: 0 };
   if (t.points > 0) map[t.user_id].earned += t.points;
   else map[t.user_id].used += Math.abs(t.points);
   });
   allStudentData = Object.values(map);
   renderStudentTable(allStudentData);
   } catch(e) {
   document.getElementById('studentTable').innerHTML = '<tr><td colspan="6" class="empty">데이터를 불러올 수 없습니다.</td></tr>';
   }
   }

   function renderStudentTable(data) {
   const tbody = document.getElementById('studentTable');
   if (!data.length) { tbody.innerHTML = '<tr><td colspan="6" class="empty text-center p-24">포인트 내역이 없는 학생이 없습니다.</td></tr>'; return; }
   data.sort((a,b) => (b.earned - b.used) - (a.earned - a.used));
   tbody.innerHTML = data.map(s => {
   const balance = s.earned - s.used;
   return `<tr>
   <td><strong>${s.user_name}</strong></td>
   <td style="font-size:13px;color:#9CA3AF">ID: ${s.user_id}</td>
   <td style="color:#10B981;font-weight:600">+${s.earned.toLocaleString()}P</td>
   <td style="color:#EF4444;font-weight:600">-${s.used.toLocaleString()}P</td>
   <td style="font-weight:700;color:#4F5EF8">${balance.toLocaleString()}P</td>
   <td><button class="btn btn-sm btn-warning" onclick="quickAdjust(${s.user_id},'${s.user_name}')">조정</button></td>
   </tr>`;
   }).join('');
   }

   function searchStudents() {
   const q = document.getElementById('searchStudentName').value.trim().toLowerCase();
   renderStudentTable(q ? allStudentData.filter(s => s.user_name.toLowerCase().includes(q) || String(s.user_id).includes(q)) : allStudentData);
   }

   function openAdjustModal() {
   ['adjUserId','adjPoints','adjDesc'].forEach(id => document.getElementById(id).value = '');
   document.getElementById('adjustModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }
   function closeAdjustModal() {
   document.getElementById('adjustModal').classList.remove('active');
   document.getElementById('sidebarOverlay').classList.remove('active');
   }
   function quickAdjust(userId, userName) {
   document.getElementById('adjUserId').value = userId;
   document.getElementById('adjDesc').value = userName + '님 포인트 조정';
   document.getElementById('adjustModal').classList.add('active');
   document.getElementById('sidebarOverlay').classList.add('active');
   }

   async function adjustPoints() {
   const userId = parseInt(document.getElementById('adjUserId').value);
   const points = parseInt(document.getElementById('adjPoints').value);
   const desc = document.getElementById('adjDesc').value.trim();
   if (!userId || !points) { alert('학생 ID와 조정 포인트를 입력해주세요.'); return; }
   if (!desc) { alert('사유를 입력해주세요.'); return; }
   try {
   await apiPost('/headquarters/point-transactions/adjust', { user_id: userId, points, description: desc });
   alert(`${points >= 0 ? '+' : ''}${points}P 조정 완료!`);
   closeAdjustModal(); loadStats(); loadTxns(1); loadStudents();
   } catch(e) { alert(e.message || '오류가 발생했습니다.'); }
   }
   </script>
   </body>
   </html>
