    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
        // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <script>
   document.addEventListener('DOMContentLoaded', async () => {
   requireAuth();
   const user = getCurrentUser();
   if (user) {
   document.getElementById('sidebarUserName').textContent = user.name || '관리자';
   document.getElementById('sidebarUserRole').textContent = '본사';
   }
   const now = new Date();
   document.getElementById('todayDate').textContent = now.toLocaleDateString('ko-KR', {
   year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
   });

   // 해시 기반 탭 전환
   function switchTab() {
   var hash = window.location.hash || '';
   // 모든 섹션 카드 숨기기
   document.querySelectorAll('.card.mb-24').forEach(function(c) { c.style.display = 'none'; });
   // 일반 설정은 항상 표시
   var general = document.querySelector('.card.mb-24:not([id])');
   if (general) general.style.display = 'block';
   // 해시에 해당하는 섹션 표시
   if (hash) {
   var target = document.querySelector(hash);
   if (target) target.style.display = 'block';
   }
   }
   switchTab();
   window.addEventListener('hashchange', switchTab);

   await loadSettings();
   loadProfile();
   });

   async function loadSettings() {
   try {
   const res = await apiGet('/headquarters/settings');
   const s = res.data || {};
   if (s.site_name) document.getElementById('siteName').value = s.site_name;
   if (s.site_description) document.getElementById('siteDescription').value = s.site_description;
   if (s.contact_email) document.getElementById('contactEmail').value = s.contact_email;
   if (s.contact_phone) document.getElementById('contactPhone').value = s.contact_phone;
   if (s.site_address) document.getElementById('siteAddress').value = s.site_address;
   if (s.business_hours) document.getElementById('businessHours').value = s.business_hours;
   if (s.lunch_hours) document.getElementById('lunchHours').value = s.lunch_hours;
   if (s.min_password_length) document.getElementById('minPasswordLength').value = s.min_password_length;
   if (s.require_special_char !== undefined) document.getElementById('requireSpecialChar').checked = s.require_special_char;
   if (s.enable_auto_backup !== undefined) document.getElementById('enableAutoBackup').checked = s.enable_auto_backup;
   if (s.email_notifications !== undefined) document.getElementById('emailNotifications').checked = s.email_notifications;
   if (s.sms_notifications !== undefined) document.getElementById('smsNotifications').checked = s.sms_notifications;
   } catch(e) {
   // Load defaults silently
   }
   }

   async function saveSettings() {
   const payload = {
   site_name: document.getElementById('siteName').value,
   site_description: document.getElementById('siteDescription').value,
   contact_email: document.getElementById('contactEmail').value,
   contact_phone: document.getElementById('contactPhone').value,
   site_address: document.getElementById('siteAddress').value,
   business_hours: document.getElementById('businessHours').value,
   lunch_hours: document.getElementById('lunchHours').value,
   min_password_length: parseInt(document.getElementById('minPasswordLength').value) || 8,
   require_special_char: document.getElementById('requireSpecialChar').checked,
   enable_auto_backup: document.getElementById('enableAutoBackup').checked,
   email_notifications: document.getElementById('emailNotifications').checked,
   sms_notifications: document.getElementById('smsNotifications').checked,
   };
   try {
   await apiPut('/headquarters/settings', payload);
   alert('설정이 저장되었습니다.');
   } catch(e) {
   alert('저장 실패: ' + (e.message || '오류'));
   }
   }

   async function loadProfile() {
   try {
   const res = await apiGet('/auth/me');
   const u = res?.data || res;
   if (u.name) document.getElementById('profileName').value = u.name;
   if (u.email) document.getElementById('profileEmail').value = u.email;
   if (u.phone) document.getElementById('profilePhone').value = u.phone;
   } catch(e) { console.warn('프로필 로드 실패', e); }
   }

   async function saveProfile() {
   const data = {
   name: document.getElementById('profileName').value,
   email: document.getElementById('profileEmail').value,
   phone: document.getElementById('profilePhone').value,
   };
   try {
   const res = await apiPut('/auth/me', data);
   showAlert(res?.message || '정보가 수정되었습니다.', 'success');
   const fresh = await apiGet('/auth/me');
   if (fresh?.data) localStorage.setItem('user', JSON.stringify(fresh.data));
   renderSidebarUser();
   } catch(e) {
   showAlert(e?.message || '저장 실패', 'error');
   }
   }

   async function changePassword() {
   const oldPw = document.getElementById('pwCurrent').value;
   const newPw = document.getElementById('pwNew').value;
   const confirmPw = document.getElementById('pwConfirm').value;
   if (!oldPw || !newPw || !confirmPw) {
   showAlert('모든 필드를 입력해주세요.', 'error');
   return;
   }
   if (newPw !== confirmPw) {
   showAlert('새 비밀번호가 일치하지 않습니다.', 'error');
   return;
   }
   if (newPw.length < 4) {
   showAlert('비밀번호는 4자 이상이어야 합니다.', 'error');
   return;
   }
   try {
   const res = await apiPut('/auth/password', { old_password: oldPw, new_password: newPw });
   showAlert(res?.message || '비밀번호가 변경되었습니다.', 'success');
   document.getElementById('pwCurrent').value = '';
   document.getElementById('pwNew').value = '';
   document.getElementById('pwConfirm').value = '';
   } catch(e) {
   showAlert(e?.message || '비밀번호 변경 실패', 'error');
   }
   }
   </script>
