    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
        // 섹션 매핑
        const sectionMap = {
            'branches.html': 'operations', 'academy-management.html': 'operations', 
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });
   </script>

   <script>
   document.addEventListener('DOMContentLoaded', function() {
   const u = JSON.parse(localStorage.getItem('user') || '{}');
   if (u.name) document.getElementById('sidebarUserName').textContent = u.name;
   document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ko-KR', {year:'numeric',month:'long',day:'numeric',weekday:'long'});
   loadRequests();
   });

   async function loadRequests() {
   const status = document.getElementById('statusFilter').value;
   const url = '/headquarters/gifticon-requests' + (status ? '?status='+status : '');
   const res = await apiGet(url);
   const data = res.data || [];
   const tbody = document.getElementById('requestsTable');
   if (!data.length) {
   tbody.innerHTML = '<tr><td colspan="7" class="text-center p-24" style="color:#9CA3AF">신청 내역이 없습니다.</td></tr>';
   return;
   }
   tbody.innerHTML = data.map(r => {
   const statusCls = 'status-' + r.status;
   const label = {pending:'승인대기',approved:'승인완료',rejected:'거절됨',completed:'지급완료'}[r.status] || r.status;
   const actions = r.status === 'pending'
   ? `<button class="btn btn-sm btn-success" onclick="handleRequest(${r.id},'approve')">승인</button>
   <button class="btn btn-sm btn-danger" onclick="handleRequest(${r.id},'reject')">거절</button>`
   : `<span style="font-size:12px;color:#9CA3AF">처리 완료</span>`;
   return `<tr>
   <td><strong>${r.user_name}</strong></td>
   <td>${r.gifticon_name}</td>
   <td><span style="color:#4F5EF8;font-weight:700">${r.points_used.toLocaleString()}p</span></td>
   <td><span class="badge ${statusCls}">${label}</span></td>
   <td style="font-size:12px">${r.requested_at || ''}</td>
   <td style="font-size:12px">${r.processed_at || '-'}</td>
   <td>${actions}</td>
   </tr>`;
   }).join('');
   }

   async function handleRequest(id, action) {
   const label = action === 'approve' ? '승인' : '거절';
   if (!confirm('정말 ' + label + '하시겠습니까?')) return;
   try {
   await apiPost('/headquarters/gifticon-requests/' + id + '/' + action);
   alert(label + ' 처리되었습니다.');
   loadRequests();
   } catch(e) { alert(e.message || '오류'); }
   }
   </script>
