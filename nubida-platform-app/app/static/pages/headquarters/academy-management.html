    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
   // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });

   <script>
// ===== XSS 방지 헬퍼 =====
window.esc = window.esc || function(str) {
    if (str == null) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
};

// ===== State =====
let allAcademies = [];
let filteredAcademies = [];
let currentPage = 1;
let totalPages = 1;
const PER_PAGE = 20;

// ===== Status Labels =====
const statusLabels = {
    'active': '운영중',
    'inactive': '정지',
};

// ===== Load Academy Stats =====
async function loadAcademyStats() {
    try {
        const res = await apiGet('/headquarters/academies/branch-stats');
        const academies = res.data || [];
        document.getElementById('statTotalAcademies').textContent = academies.length;
        document.getElementById('statTotalStudents').textContent = academies.reduce(function(s, a) { return s + (a.student_count || 0); }, 0);
        document.getElementById('statTotalCourses').textContent = academies.reduce(function(s, a) { return s + (a.course_count || 0); }, 0);
    } catch (err) {
        console.warn('Failed to load academy stats:', err);
    }
}

// ===== Load Academies =====
async function loadAcademies(page) {
    currentPage = page || 1;
    const status = document.getElementById('statusFilter').value;

    try {
        let url = '/headquarters/academies?page=' + currentPage + '&per_page=' + PER_PAGE;
        if (status) url += '&status=' + encodeURIComponent(status);

        const res = await apiGet(url);
        allAcademies = res.data || [];
        totalPages = res.total_pages || 1;
        filteredAcademies = [...allAcademies];
        renderAcademies();
        renderPaginationUI();
        document.getElementById('academyCount').textContent = (res.total || 0) + '개';
    } catch (err) {
        console.error('Failed to load academies:', err);
        showAlert('학원 목록을 불러오는데 실패했습니다.', 'error');
    }
}

// ===== Render Academies =====
function renderAcademies() {
    const tbody = document.getElementById('academyTableBody');

    if (filteredAcademies.length === 0) {
        tbody.innerHTML = '<tr class="branch-empty"><td colspan="10">🏫 등록된 학원이 없습니다.</td></tr>';
        return;
    }

    let html = '';
    filteredAcademies.forEach(function(a) {
        const statusLabel = statusLabels[a.status] || a.status || '-';
        const statusClass = a.status || 'inactive';
        const createdDate = a.created_at ? a.created_at.split('T')[0] : '-';

        html += '<tr>';
        html += '<td style="font-size:12px;color:var(--text-tertiary)">' + esc('' + a.id) + '</td>';
        html += '<td><strong>' + esc(a.name || '-') + '</strong></td>';
        html += '<td><span class="branch-code">' + esc(a.code || '-') + '</span></td>';
        html += '<td style="font-size:12px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(a.address || '') + '">' + esc(a.address || '-') + '</td>';
        html += '<td style="white-space:nowrap"><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.student_count ?? a.student_cnt ?? 0) + '</td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.employee_count ?? a.employee_cnt ?? a.staff_count ?? 0) + '</td>';
        html += '<td style="font-size:12px;text-align:center">' + (a.course_count ?? a.course_cnt ?? 0) + '</td>';
        html += '<td style="font-size:12px;color:var(--text-tertiary)">' + createdDate + '</td>';
        html += '<td>';
        html += '<div class="action-cell">';
        html += '<button class="btn btn-ghost btn-xs" onclick="openEditModal(' + a.id + ')">✏️ 수정</button>';
        html += '<button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="confirmDeleteAcademy(' + a.id + ',\'' + esc(a.name) + '\')">🗑️ 삭제</button>';
        html += '</div></td></tr>';
    });
    tbody.innerHTML = html;
}

// ===== Filter =====
function filterAcademies() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) {
        filteredAcademies = [...allAcademies];
    } else {
        filteredAcademies = allAcademies.filter(function(a) {
            return (a.name && a.name.toLowerCase().includes(q)) ||
                   (a.code && a.code.toLowerCase().includes(q)) ||
                   (a.address && a.address.toLowerCase().includes(q));
        });
    }
    renderAcademies();
}

// ===== Pagination =====
function renderPaginationUI() {
    const wrap = document.getElementById('paginationWrap');
    let html = '';

    if (currentPage > 1) {
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(1)">«</button>';
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + (currentPage - 1) + ')">‹</button>';
    } else {
        html += '<button class="btn btn-ghost btn-sm" disabled>«</button><button class="btn btn-ghost btn-sm" disabled>‹</button>';
    }

    const start = Math.max(1, currentPage - 2);
    const end = Math.min(totalPages, currentPage + 2);
    for (let i = start; i <= end; i++) {
        html += '<button class="btn btn-sm ' + (i === currentPage ? 'btn-primary' : 'btn-ghost') + '" onclick="loadAcademies(' + i + ')">' + i + '</button>';
    }

    if (currentPage < totalPages) {
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + (currentPage + 1) + ')">›</button>';
        html += '<button class="btn btn-ghost btn-sm" onclick="loadAcademies(' + totalPages + ')">»</button>';
    } else {
        html += '<button class="btn btn-ghost btn-sm" disabled>›</button><button class="btn btn-ghost btn-sm" disabled>»</button>';
    }

    wrap.innerHTML = html;
}

// ===== Create Academy =====
async function createAcademy() {
    const name = document.getElementById('newName').value.trim();
    const code = document.getElementById('newCode').value.trim().toUpperCase();
    const address = document.getElementById('newAddress').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const email = document.getElementById('newEmail').value.trim();

    if (!name || !code) {
        showAlert('학원명과 코드는 필수 항목입니다.', 'error');
        return;
    }

    try {
        await apiPost('/headquarters/academies', { name, code, address, phone, email });
        showAlert('학원이 등록되었습니다.', 'success');
        closeModal('createAcademyModal');
        document.getElementById('newName').value = '';
        document.getElementById('newCode').value = '';
        document.getElementById('newAddress').value = '';
        document.getElementById('newPhone').value = '';
        document.getElementById('newEmail').value = '';
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 등록에 실패했습니다.', 'error');
    }
}

// ===== Open Edit Modal =====
function openEditModal(academyId) {
    const academy = allAcademies.find(function(a) { return a.id === academyId; });
    if (!academy) {
        showAlert('학원 정보를 찾을 수 없습니다.', 'error');
        return;
    }
    document.getElementById('editAcademyId').value = academy.id;
    document.getElementById('editName').value = academy.name || '';
    document.getElementById('editStatus').value = academy.status || 'active';
    document.getElementById('editAddress').value = academy.address || '';
    document.getElementById('editPhone').value = academy.phone || '';
    document.getElementById('editEmail').value = academy.email || '';
    document.getElementById('editAcademyModal').style.display = 'flex';
}

// ===== Open Create Modal =====
function openCreateModal() {
    document.getElementById('createAcademyModal').style.display = 'flex';
}

// ===== Update Academy =====
async function updateAcademy() {
    const id = document.getElementById('editAcademyId').value;
    const name = document.getElementById('editName').value.trim();
    const status = document.getElementById('editStatus').value;
    const address = document.getElementById('editAddress').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const email = document.getElementById('editEmail').value.trim();

    if (!name) {
        showAlert('학원명을 입력하세요.', 'error');
        return;
    }

    try {
        await apiPut('/headquarters/academies/' + id, { name, status, address, phone, email });
        showAlert('학원 정보가 수정되었습니다.', 'success');
        closeModal('editAcademyModal');
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 정보 수정에 실패했습니다.', 'error');
    }
}

// ===== Delete Academy =====
let deleteTargetId = null;
let deleteTargetName = '';

function confirmDeleteAcademy(id, name) {
    deleteTargetId = id;
    deleteTargetName = name || '';
    if (confirm('정말 학원 "' + (deleteTargetName || id) + '" 을(를) 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
        executeDeleteAcademy();
    }
}

async function executeDeleteAcademy() {
    if (!deleteTargetId) return;
    try {
        await apiDelete('/headquarters/academies/' + deleteTargetId);
        showAlert('학원이 삭제되었습니다.', 'success');
        deleteTargetId = null;
        deleteTargetName = '';
        await Promise.all([loadAcademies(currentPage), loadAcademyStats()]);
    } catch (err) {
        showAlert(err.message || '학원 삭제에 실패했습니다.', 'error');
    }
}

async function deleteAcademy(id) {
    confirmDeleteAcademy(id, '');
}

// ===== Close Modal =====
function closeModal(modalId) {
    var el = document.getElementById(modalId);
    if (el) el.style.display = 'none';
}

// ===== Initialize =====
onAuthReady(async function() {
    await Promise.all([loadAcademies(1), loadAcademyStats()]);
});

</script>
