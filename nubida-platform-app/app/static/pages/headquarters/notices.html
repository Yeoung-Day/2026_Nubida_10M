    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const currentPage = window.location.pathname.split('/').pop();
        
   // 섹션 매핑
   const sectionMap = {
   'branches.html': 'operations', 'academy-management.html': 'operations',
   'courses.html': 'operations', 'users.html': 'operations',
   'payments.html': 'finance', 'revenue-approval.html': 'finance', 'statistics.html': 'finance',
   'point-management.html': 'point', 'point-settings.html': 'point',
   'gifticon-settings.html': 'point', 'gifticon-management.html': 'point',
   'director-reports.html': 'report', 'notices.html': 'report',
   'portfolio.html': 'report', 'videos.html': 'report', 'classroom.html': 'report',
   'withdrawn-students.html': 'system', 'backups.html': 'system',
   'approvals.html': 'system', 'settings.html': 'system', 'chat.html': 'system',
   'category-manager.html': 'system', 'category.html': 'system',
   };

   const currentSection = sectionMap[currentPage];
   if (currentSection) {
   const toggle = document.querySelector(`.nav-toggle[data-section="${currentSection}"]`);
   if (toggle) {
   toggle.classList.add('open');
   const sub = document.getElementById(`sub-${currentSection}`);
   if (sub) sub.classList.add('open');
   }
   }

   // 토글 버튼 클릭 이벤트 — 누르면 열고/닫기
   document.querySelectorAll('.nav-toggle').forEach(btn => {
   btn.addEventListener('click', function(e) {
   e.preventDefault();
   const section = this.dataset.section;
   const sub = document.getElementById(`sub-${section}`);
   const isOpen = sub.classList.contains('open');

   if (isOpen) {
   sub.classList.remove('open');
   this.classList.remove('open');
   } else {
   // 다른 열린 섹션 모두 닫기
   document.querySelectorAll('.nav-submenu.open').forEach(el => el.classList.remove('open'));
   document.querySelectorAll('.nav-toggle.open').forEach(el => el.classList.remove('open'));
   // 현재 섹션 열기
   sub.classList.add('open');
   this.classList.add('open');
   }
   });
   });

   // active 표시
   document.querySelectorAll('.nav-item').forEach(item => {
   const href = item.getAttribute('href');
   if (href && href === currentPage) {
   item.classList.add('active');
   }
   });
   });

  <script>
  // ===== XSS Helper =====
  function escHtml(s) {
    if (s == null) return '';
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // formatDate fallback: utils.js 로드 실패 시 대비
  if (typeof formatDate !== 'function') {
    window.formatDate = function(d) {
      if (!d) return '-';
      try {
        const date = new Date(d);
        if (isNaN(date.getTime())) return d;
        return date.toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' });
      } catch(e) { return d; }
    };
  }

  // ===== State =====
  let allNotices = [];
  let currentPage = 1;
  let totalPages = 1;
  const PER_PAGE = 20;

  // ===== Status Labels =====
  const statusLabels = {
    'published': '발행',
    'draft': '임시저장',
  };

  // ===== Initialization =====
  document.addEventListener('DOMContentLoaded', function() {
    requireAuth();
    renderSidebarUser();
    onAuthReady(function() { loadNotices(1); });
  });

  // ===== Load Notices =====
  async function loadNotices(page) {
    currentPage = page || 1;
    const status = document.getElementById('statusFilter').value;

    try {
      let url = '/headquarters/notices?page=' + currentPage + '&per_page=' + PER_PAGE;
      if (status) url += '&status=' + encodeURIComponent(status);

      const res = await apiGet(url);
      allNotices = res.data || [];
      totalPages = res.total_pages || 1;
      renderNotices();
      renderPaginationUI();
      document.getElementById('noticeCount').textContent = (res.total || 0) + '개';
    } catch (err) {
      console.error('Failed to load notices:', err);
      showAlert('공지사항 목록을 불러오는데 실패했습니다.', 'error');
    }
  }

  // ===== Filter Notices =====
  function filterNotices() {
    loadNotices(1);
  }

  // ===== Render Notices =====
  function renderNotices() {
    const tbody = document.getElementById('noticeTableBody');

    if (allNotices.length === 0) {
      tbody.innerHTML = '<tr class="notice-empty"><td colspan="8">📢 등록된 공지사항이 없습니다.</td></tr>';
      return;
    }

    // Pinned notices first, then by created_at desc
    const sorted = [...allNotices].sort((a, b) => {
      if (a.is_pinned && !b.is_pinned) return -1;
      if (!a.is_pinned && b.is_pinned) return 1;
      return new Date(b.created_at) - new Date(a.created_at);
    });

    let html = '';
    sorted.forEach(n => {
      const statusLabel = statusLabels[n.status] || n.status || '-';
      const statusClass = n.status || 'draft';
      const pinnedIcon = n.is_pinned ? '📌' : '·';
      const pinnedClass = n.is_pinned ? 'yes' : 'no';
      const rowClass = n.is_pinned ? 'notice-pinned' : '';
      const createdDate = n.created_at ? formatDate(n.created_at) : '-';
      // Truncate title for display
      const title = n.title || '-';
      const titleDisplay = title.length > 50 ? escHtml(title.substring(0, 50)) + '…' : escHtml(title);

      html += '<tr class="' + rowClass + '">';
      html += '<td style="font-size:12px;color:var(--text-tertiary)">' + escHtml('' + n.id) + '</td>';
      html += '<td><strong title="' + escHtml(title) + '">' + titleDisplay + '</strong></td>';
      html += '<td style="font-size:12px">' + escHtml(n.author || '-') + '</td>';
      html += '<td><span class="status-badge ' + statusClass + '">' + statusLabel + '</span></td>';
      html += '<td style="text-align:center"><span class="pinned-badge ' + pinnedClass + '">' + pinnedIcon + '</span></td>';
      html += '<td style="text-align:center;font-size:12px;color:var(--text-tertiary)">' + (n.view_count != null ? escHtml('' + n.view_count) : '0') + '</td>';
      html += '<td style="font-size:12px;color:var(--text-tertiary)">' + createdDate + '</td>';
      html += '<td>';
      html += '<div class="action-cell">';
      html += '<button class="btn btn-ghost btn-xs" onclick="openEditModal(' + n.id + ')">✏️ 수정</button>';
      html += '<button class="btn btn-ghost btn-xs" style="color:var(--danger)" onclick="confirmDeleteNotice(' + n.id + ',\'' + escHtml(n.title || '') + '\')">🗑️ 삭제</button>';
      html += '</div>';
      html += '</td>';
      html += '</tr>';
    });
    tbody.innerHTML = html;
  }

  // ===== Pagination =====
  function renderPaginationUI() {
    const wrap = document.getElementById('paginationWrap');
    let html = '';

    if (currentPage > 1) {
      html += '<button onclick="loadNotices(1)">«</button>';
      html += '<button onclick="loadNotices(' + (currentPage - 1) + ')">‹</button>';
    } else {
      html += '<button disabled>«</button><button disabled>‹</button>';
    }

    const start = Math.max(1, currentPage - 2);
    const end = Math.min(totalPages, currentPage + 2);
    for (let i = start; i <= end; i++) {
      html += '<button class="' + (i === currentPage ? 'active' : '') + '" onclick="loadNotices(' + i + ')">' + i + '</button>';
    }

    if (currentPage < totalPages) {
      html += '<button onclick="loadNotices(' + (currentPage + 1) + ')">›</button>';
      html += '<button onclick="loadNotices(' + totalPages + ')">»</button>';
    } else {
      html += '<button disabled>›</button><button disabled>»</button>';
    }

    wrap.innerHTML = html;
  }

  // ===== Create Notice =====
  async function createNotice() {
    const title = document.getElementById('newTitle').value.trim();
    const content = document.getElementById('newContent').value.trim();
    const author = document.getElementById('newAuthor').value.trim();
    const status = document.getElementById('newStatus').value;
    const is_pinned = document.getElementById('newIsPinned').checked;

    if (!title || !content || !author) {
      showAlert('제목, 내용, 작성자는 필수 항목입니다.', 'error');
      return;
    }

    try {
      await apiPost('/headquarters/notices', { title, content, author, status, is_pinned });
      showAlert('공지사항이 등록되었습니다.', 'success');
      closeModal('createNoticeModal');
      // 폼 초기화
      document.getElementById('newTitle').value = '';
      document.getElementById('newContent').value = '';
      document.getElementById('newAuthor').value = '';
      document.getElementById('newStatus').value = 'published';
      document.getElementById('newIsPinned').checked = false;
      await loadNotices(1);
    } catch (err) {
      showAlert(err.message || '공지사항 등록에 실패했습니다.', 'error');
    }
  }

  // ===== Open Edit Modal =====
  function openEditModal(noticeId) {
    const notice = allNotices.find(n => n.id === noticeId);
    if (!notice) {
      showAlert('공지사항 정보를 찾을 수 없습니다.', 'error');
      return;
    }

    document.getElementById('editNoticeId').value = notice.id;
    document.getElementById('editTitle').value = notice.title || '';
    document.getElementById('editContent').value = notice.content || '';
    document.getElementById('editAuthor').value = notice.author || '';
    document.getElementById('editStatus').value = notice.status || 'published';
    document.getElementById('editIsPinned').checked = notice.is_pinned || false;

    openModal('editNoticeModal');
  }

  // ===== Update Notice =====
  async function updateNotice() {
    const id = parseInt(document.getElementById('editNoticeId').value);
    const title = document.getElementById('editTitle').value.trim();
    const content = document.getElementById('editContent').value.trim();
    const author = document.getElementById('editAuthor').value.trim();
    const status = document.getElementById('editStatus').value;
    const is_pinned = document.getElementById('editIsPinned').checked;

    if (!title || !content || !author) {
      showAlert('제목, 내용, 작성자는 필수 항목입니다.', 'error');
      return;
    }

    try {
      await apiPut('/headquarters/notices/' + id, { title, content, author, status, is_pinned });
      showAlert('공지사항이 수정되었습니다.', 'success');
      closeModal('editNoticeModal');
      await loadNotices(currentPage);
    } catch (err) {
      showAlert(err.message || '공지사항 수정에 실패했습니다.', 'error');
    }
  }

  // ===== Delete Notice =====
  function confirmDeleteNotice(id, title) {
    if (confirm('"' + (title || '') + '" 공지사항을 삭제하시겠습니까?')) {
      deleteNotice(id);
    }
  }

  async function deleteNotice(id) {
    try {
      await apiDelete('/headquarters/notices/' + id);
      showAlert('공지사항이 삭제되었습니다.', 'success');
      await loadNotices(currentPage);
    } catch (err) {
      showAlert(err.message || '공지사항 삭제에 실패했습니다.', 'error');
    }
  }
  </script>
     </body>
     </html>
